<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>In Pieces</title>
<style>
html,body{margin:0;height:100%;background:#07060b;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#ece8f2}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,6,14,.78);text-align:center;padding:16px;gap:12px;box-sizing:border-box;overflow:auto}
.ov.show{display:flex}
h1{margin:0;font-size:46px;letter-spacing:3px;color:#ffd86b;text-shadow:0 0 22px #e0902a,0 3px 0 #6a3d10}
h2{margin:0;font-size:28px;color:#ffd86b;text-shadow:0 0 16px #e0902a}
p{margin:0;max-width:340px;line-height:1.45;color:#bdb6cc;font-size:15px}
.cards{display:flex;flex-direction:column;gap:10px;width:min(360px,92vw)}
.card{display:flex;gap:12px;align-items:center;background:#1c1830;border:2px solid #5a4a8a;border-radius:14px;color:#ece8f2;padding:11px 14px;text-align:left;cursor:pointer;font-family:inherit}
.card:active{transform:scale(.98);border-color:#ffd86b}
.card .gl{font-size:40px;line-height:1;color:#fff;text-shadow:0 0 6px #ffd86b;flex:none;width:44px;text-align:center}
.card b{display:block;font-size:17px;color:#ffd86b}
.card span{font-size:13.5px;color:#bdb6cc}
.card i{float:right;font-style:normal;font-size:12px;color:#8fe0b8}
.big{background:linear-gradient(#ffb347,#e0742a);border:0;color:#2a1000;font-size:20px;font-weight:800;padding:13px 40px;border-radius:40px;box-shadow:0 0 22px #ff9d2f77;cursor:pointer}
#mute{position:fixed;bottom:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:#0007;color:#fff;font-size:16px;z-index:5}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#07060b;z-index:20}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<button id="mute" aria-label="Toggle sound">🔊</button>
<div id="err"><p>This game needs WebGL, which your browser could not start.</p></div>

<div id="menu" class="ov show">
  <h1>IN PIECES</h1>
  <p>You are a stone chess piece in a crumbling dungeon. Tap a highlighted tile to move or attack. Dodge the red warnings, level up, and promote your piece. What breaks, breaks into pieces.</p>
  <p id="best"></p>
  <div class="cards" id="starts"></div>
</div>

<div id="pick" class="ov">
  <h2 id="pickTitle">LEVEL UP!</h2>
  <div class="cards" id="cards"></div>
</div>

<div id="dead" class="ov">
  <h2>SHATTERED</h2>
  <p id="stats"></p>
  <button class="big" id="again">TRY AGAIN</button>
</div>

<script src="three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const hud=$('c'),ctx=hud.getContext('2d');
const COLS=7,ROWS=9,TOP_H=88,BOT_H=46;
let W=0,H=0;

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const ri=(a,b)=>a+((Math.random()*(b-a+1))|0);
const pick=a=>a[(Math.random()*a.length)|0];
const ORTH=[[0,-1],[0,1],[-1,0],[1,0]],DIAG=[[-1,-1],[1,-1],[-1,1],[1,1]],DIR8=ORTH.concat(DIAG);
const KN=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const lerpAng=(a,b,t)=>{const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t;};

/* ---------- audio ---------- */
let ac=null,muted=false;
function audio(){
  if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
}
function tone(f,d,type='triangle',v=0.06,slide=0){
  if(muted)return;
  try{
    audio();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
function crash(big){ // stone cracking: noise burst + low thud
  if(muted)return;
  try{
    audio();
    const len=Math.floor(ac.sampleRate*(big?0.5:0.28)),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    src.buffer=buf;f.type='lowpass';f.frequency.value=big?1800:2600;g.gain.value=big?0.28:0.18;
    src.connect(f);f.connect(g);g.connect(ac.destination);src.start();
    tone(big?70:100,0.25,'sine',0.14,-40);
  }catch(e){}
}
$('mute').onclick=e=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';e.stopPropagation();};

/* ---------- data ---------- */
const GL={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const gl=t=>GL[t]+'︎';
const PIECES={
  P:{name:'Pawn',cd:0.5,dmg:1,desc:'Steps 1 tile, strikes diagonally. Starts weak, grows fast.'},
  N:{name:'Knight',cd:0.6,dmg:2,desc:'Leaps in an L over anything. Hits hard.'},
  B:{name:'Bishop',cd:0.55,dmg:2,desc:'Slides diagonally, and can sidestep 1 tile.'},
  R:{name:'Rook',cd:0.65,dmg:3,desc:'Slides any distance in straight lines. Heavy hitter.'},
  Q:{name:'Queen',cd:0.5,dmg:4,desc:'Slides in all eight directions. Deadly.'},
};
const ENEMY={
  P:{hp:1,dmg:1,cd:1.1,wind:0.5,xp:1,cost:1},
  N:{hp:2,dmg:1,cd:1.4,wind:0.6,xp:2,cost:2},
  B:{hp:2,dmg:1,cd:1.2,wind:0.6,xp:2,cost:2},
  R:{hp:4,dmg:2,cd:1.3,wind:0.7,xp:3,cost:3},
  Q:{hp:6,dmg:2,cd:1.0,wind:0.5,xp:5,cost:5},
  K:{hp:14,dmg:2,cd:0.9,wind:0.6,xp:15,cost:99},
};
const THEMES=[
  {name:'The Crypt',a:0xb4bcd8,b:0x8e96b0,wall:0x9aa0ba,fog:0x0c0e18,glow:[150,170,255]},
  {name:'The Foundry',a:0xd8b49a,b:0xaa8672,wall:0xb08a74,fog:0x160c08,glow:[255,150,90]},
  {name:'The Grotto',a:0x9fd0c8,b:0x78a8a0,wall:0x7fb0a8,fog:0x081414,glow:[110,255,210]},
];
const UPS=[
  {id:'hp',n:'Iron Will',g:'♥',d:'+2 max HP and heal 2',max:6,f:()=>{P.maxHp+=2;P.hp=Math.min(P.maxHp,P.hp+2);}},
  {id:'edge',n:'Sharp Edge',g:'⚔',d:'+1 damage',max:5,f:()=>P.dmgB++},
  {id:'swift',n:'Swift Feet',g:'»',d:'Move 15% faster',max:5,f:()=>P.cdMult*=0.85},
  {id:'tithe',n:'Blood Tithe',g:'✚',d:'Heal 1 HP every 3 captures',max:3,f:()=>P.tithe++},
  {id:'parry',n:'Parry',g:'◈',d:'A shield blocks one hit, recharges in 14s',max:3,f:()=>{P.parry++;P.shield=1;}},
  {id:'splash',n:'Shockwave',g:'✸',d:'Captures hit adjacent enemies for 1',max:3,f:()=>P.splash++},
  {id:'luck',n:'Lucky Loot',g:'✦',d:'More hearts drop from enemies',max:3,f:()=>P.luck++},
];

/* =====================================================================
   3D ENGINE
   ===================================================================== */
let renderer;
try{
  renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});
}catch(e){$('err').style.display='flex';throw e;}
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,120);
const camBase=new THREE.Vector3(),camTarget=new THREE.Vector3(0,0.15,0.1);
const ptsMats=[];

function fitCamera(){
  const el=THREE.MathUtils.degToRad(50),lo=-1+2*BOT_H/H,hi=1-2*TOP_H/H;
  const pts=[[-4,0,-5],[4,0,-5],[-4,0,5],[4,0,5],[-3.8,1.0,-4.8],[3.8,1.0,-4.8]].map(p=>new THREE.Vector3(...p));
  for(let d=10;d<70;d+=0.2){
    camera.position.set(0,camTarget.y+Math.sin(el)*d,camTarget.z+Math.cos(el)*d);
    camera.lookAt(camTarget);camera.updateMatrixWorld();camera.updateProjectionMatrix();
    let ok=true;
    for(const p of pts){const v=p.clone().project(camera);if(Math.abs(v.x)>0.96||v.y<lo||v.y>hi){ok=false;break;}}
    if(ok){camBase.copy(camera.position);return;}
  }
  camBase.copy(camera.position);
}
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  hud.width=W*dpr;hud.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  renderer.setPixelRatio(dpr);renderer.setSize(W,H,false);
  camera.aspect=W/H;fitCamera();
  ptsMats.forEach(m=>m.uniforms.scale.value=H*dpr*0.5);
}

/* lights */
const hemi=new THREE.HemisphereLight(0xb0b8e0,0x2a2018,0.75);scene.add(hemi);
const dirLight=new THREE.DirectionalLight(0xfff0dd,1.05);
dirLight.position.set(-5,11,7);dirLight.castShadow=true;
dirLight.shadow.mapSize.set(1024,1024);
Object.assign(dirLight.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:30});
dirLight.shadow.bias=-0.0006;scene.add(dirLight);
const playerLight=new THREE.PointLight(0xffd27a,0.9,5,2);scene.add(playerLight);
const torches=[];

/* ---------- procedural textures ---------- */
function mkTex(w,h,draw,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  if(srgb)t.encoding=THREE.sRGBEncoding;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;
  return t;
}
function stoneDraw(base,seed,crack,bevel){
  return(g,w,h)=>{
    const r=mulberry(seed);
    g.fillStyle=base;g.fillRect(0,0,w,h);
    for(let i=0;i<w*h/50;i++){const v=r()>0.5?255:0;g.fillStyle=`rgba(${v},${v},${v},${r()*0.08})`;g.fillRect(r()*w,r()*h,1+r()*3,1+r()*3);}
    for(let i=0;i<16;i++){g.fillStyle=`rgba(0,0,0,${r()*0.07})`;g.beginPath();g.arc(r()*w,r()*h,8+r()*26,0,7);g.fill();}
    for(let i=0;i<8;i++){g.fillStyle=`rgba(255,255,255,${r()*0.05})`;g.beginPath();g.arc(r()*w,r()*h,6+r()*18,0,7);g.fill();}
    for(let c=0;c<crack;c++){
      g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=1+r()*1.6;
      let x=r()*w,y=r()*h;g.beginPath();g.moveTo(x,y);
      for(let k=0;k<7;k++){x+=(r()-0.5)*w*0.3;y+=(r()-0.5)*h*0.3;g.lineTo(x,y);}
      g.stroke();
    }
    if(bevel){
      g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=7;g.strokeRect(0,0,w,h);
      g.strokeStyle='rgba(255,255,255,.1)';g.lineWidth=2;g.strokeRect(6,6,w-12,h-12);
    }
  };
}
const brickDraw=(g,w,h)=>{
  const r=mulberry(77);g.fillStyle='#262626';g.fillRect(0,0,w,h);
  const rows=8,bh=h/rows;
  for(let y=0;y<rows;y++){
    const off=(y&1)?w/8:0;
    for(let x=-1;x<4;x++){
      const bw=w/4,bx=x*bw+off,v=130+r()*60|0;
      g.fillStyle=`rgb(${v},${v},${v+4})`;g.fillRect(bx+2,y*bh+2,bw-4,bh-4);
      for(let i=0;i<40;i++){g.fillStyle=`rgba(0,0,0,${r()*0.12})`;g.fillRect(bx+r()*bw,y*bh+r()*bh,2+r()*4,1+r()*3);}
      g.fillStyle='rgba(255,255,255,.1)';g.fillRect(bx+2,y*bh+2,bw-4,3);
    }
  }
};
const marbleDraw=(g,w,h)=>{
  const r=mulberry(5);g.fillStyle='#ece8de';g.fillRect(0,0,w,h);
  for(let i=0;i<1400;i++){g.fillStyle=`rgba(120,115,110,${r()*0.06})`;g.fillRect(r()*w,r()*h,1+r()*3,1+r()*3);}
  for(let v=0;v<9;v++){
    g.strokeStyle=v%3===0?'rgba(190,150,70,.35)':'rgba(110,110,125,.28)';g.lineWidth=0.8+r()*2;
    g.beginPath();let x=r()*w,y=0;g.moveTo(x,y);
    for(let k=0;k<6;k++){x+=(r()-0.5)*70;y+=h/6;g.quadraticCurveTo(x+(r()-0.5)*50,y-h/12,x,y);}
    g.stroke();
  }
};
const obsidianDraw=(g,w,h)=>{
  const r=mulberry(9);g.fillStyle='#37333f';g.fillRect(0,0,w,h);
  for(let i=0;i<1800;i++){const v=r()>0.5?255:0;g.fillStyle=`rgba(${v},${v},${v},${r()*0.07})`;g.fillRect(r()*w,r()*h,1+r()*3,1+r()*3);}
  for(let v=0;v<7;v++){
    g.strokeStyle=`rgba(${150+r()*80|0},60,${160+r()*90|0},.38)`;g.lineWidth=0.7+r()*1.4;
    g.beginPath();let x=r()*w,y=r()*h;g.moveTo(x,y);
    for(let k=0;k<5;k++){x+=(r()-0.5)*60;y+=(r()-0.5)*60;g.lineTo(x,y);}
    g.stroke();
  }
};
let _glowTex=null;
function glowTex(){
  if(!_glowTex)_glowTex=mkTex(64,64,(g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.4,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);},false);
  return _glowTex;
}

/* ---------- materials ---------- */
const TILE_MATS=[[],[]];
for(let p=0;p<2;p++)for(let v=0;v<4;v++){
  const t=mkTex(128,128,stoneDraw('#74747f',100+p*10+v,v%2?2:1,true));
  TILE_MATS[p].push(new THREE.MeshStandardMaterial({map:t,bumpMap:t,bumpScale:1.2,roughness:0.92,metalness:0.02}));
}
const brickTex=mkTex(256,256,brickDraw);
const WALL_MAT=new THREE.MeshStandardMaterial({map:brickTex,bumpMap:brickTex,bumpScale:1.5,roughness:0.95});
const frameTex=brickTex.clone();frameTex.repeat.set(4,1);frameTex.needsUpdate=true;
const FRAME_MAT=new THREE.MeshStandardMaterial({map:frameTex,roughness:0.95});
const marbleTex=mkTex(256,256,marbleDraw);
const MARBLE=new THREE.MeshStandardMaterial({color:0xe6e2d6,map:marbleTex,bumpMap:marbleTex,bumpScale:0.4,roughness:0.32,metalness:0.05,emissive:0x2a1c08,emissiveIntensity:0.18,side:THREE.DoubleSide});
const GOLD=new THREE.MeshStandardMaterial({color:0xe0b040,roughness:0.28,metalness:0.9,emissive:0x3a2800,emissiveIntensity:0.5});
const obsTex=mkTex(256,256,obsidianDraw);
const OBSIDIAN=new THREE.MeshStandardMaterial({map:obsTex,bumpMap:obsTex,bumpScale:0.5,roughness:0.66,metalness:0.08,emissive:0x000000,side:THREE.DoubleSide});
const INNER_STONE=new THREE.MeshStandardMaterial({color:0xb0a99d,roughness:1});
const INNER_OBS=new THREE.MeshStandardMaterial({color:0x6b5a7a,roughness:0.8,emissive:0x2a1040,emissiveIntensity:0.6});
const EYE_MAT=new THREE.MeshBasicMaterial({color:0xff2a3a});
const DARK_MAT=new THREE.MeshStandardMaterial({color:0x07060a,roughness:1});
const GROUT=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x050507,roughness:1}));
GROUT.rotation.x=-Math.PI/2;GROUT.position.y=-0.3;GROUT.receiveShadow=true;scene.add(GROUT);

/* ---------- piece geometry ---------- */
const HEIGHT={P:0.82,N:1.08,B:1.18,R:0.98,Q:1.28,K:1.52};
const PS=1.06,PSY=1.22; // overall piece scale
function lathe(pts,mat,seg=28){
  const m=new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg),mat);
  m.castShadow=true;m.receiveShadow=true;return m;
}
function ball(r,y,mat,x=0,z=0){const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat);m.position.set(x,y,z);m.castShadow=true;return m;}
function ring(rad,tube,y,mat){const m=new THREE.Mesh(new THREE.TorusGeometry(rad,tube,8,28),mat);m.rotation.x=Math.PI/2;m.position.y=y;m.castShadow=true;return m;}
function cone(r,h,mat){const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,8),mat);m.castShadow=true;return m;}
function roundedShape(pts){
  const s=new THREE.Shape(),n=pts.length,mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const m0=mid(pts[n-1],pts[0]);s.moveTo(m0[0],m0[1]);
  for(let i=0;i<n;i++){const p=pts[i],m=mid(p,pts[(i+1)%n]);s.quadraticCurveTo(p[0],p[1],m[0],m[1]);}
  return s;
}
const BASE=[[0.001,0],[0.37,0],[0.39,0.03],[0.38,0.07],[0.31,0.11],[0.26,0.16]];
function buildPiece(type,player){
  const body=player?MARBLE:OBSIDIAN,acc=player?GOLD:null;
  const g=new THREE.Group(),inner=new THREE.Group();g.add(inner);
  const add=m=>{inner.add(m);return m;};
  let eyeY=0.6,eyeZ=0.16,eyeX=0.075;
  const eyeMat=player?DARK_MAT:EYE_MAT;
  if(type==='P'){
    add(lathe(BASE.concat([[0.2,0.2],[0.14,0.32],[0.12,0.42],[0.21,0.45],[0.22,0.49],[0.12,0.52],[0.001,0.52]]),body));
    add(ball(0.17,0.66,body));
    if(acc)add(ring(0.27,0.018,0.17,acc));
    eyeY=0.68;eyeZ=0.15;
  }else if(type==='R'){
    add(lathe(BASE.concat([[0.22,0.2],[0.21,0.5],[0.22,0.58],[0.3,0.64],[0.3,0.86],[0.255,0.86],[0.255,0.78],[0.001,0.78]]),body));
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3,b=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.13,0.13),body);
      b.position.set(Math.cos(a)*0.28,0.925,Math.sin(a)*0.28);b.rotation.y=-a;b.castShadow=true;add(b);
    }
    if(acc){add(ring(0.28,0.016,0.15,acc));add(ring(0.31,0.02,0.64,acc));}
    eyeY=0.55;eyeZ=0.225;eyeX=0.08;
  }else if(type==='B'){
    add(lathe(BASE.concat([[0.2,0.2],[0.14,0.4],[0.12,0.55],[0.22,0.58],[0.23,0.63],[0.13,0.67],[0.2,0.8],[0.22,0.92],[0.16,1.05],[0.08,1.11],[0.001,1.13]]),body));
    add(ball(0.065,1.17,acc||body));
    const slit=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.26,0.5),DARK_MAT);slit.position.set(0,0.93,0);slit.rotation.z=-0.45;add(slit);
    if(acc){add(ring(0.27,0.018,0.17,acc));add(ring(0.22,0.016,0.6,acc));}
    eyeY=0.76;eyeZ=0.19;
  }else if(type==='Q'){
    add(lathe(BASE.concat([[0.22,0.2],[0.15,0.45],[0.13,0.62],[0.26,0.67],[0.26,0.72],[0.14,0.77],[0.2,0.93],[0.31,1.1],[0.27,1.14],[0.001,1.14]]),body));
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4,c=cone(0.045,0.2,acc||body);
      c.position.set(Math.cos(a)*0.285,1.23,Math.sin(a)*0.285);c.rotation.z=Math.cos(a)*-0.18;c.rotation.x=Math.sin(a)*0.18;add(c);

function emit(sys,x,y,z,vx,vy,vz,life,size,c,grow=0){
  if(sys.list.length>=sys.max)sys.list.shift();
  sys.list.push({x,y,z,vx,vy,vz,life,max:life,size,c,grow});
}
function updatePoints(sys,dt){
  const L=sys.list;
  for(let i=L.length-1;i>=0;i--){
    const p=L[i];p.life-=dt;
    if(p.life<=0){L.splice(i,1);continue;}
    const dr=Math.exp(-sys.drag*dt);p.vx*=dr;p.vz*=dr;p.vy+=sys.grav*dt;p.vy*=Math.exp(-sys.drag*0.3*dt);
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    if(p.y<0.02&&sys===sparkSys){p.y=0.02;p.vy*=-0.4;}
  }
  let n=0;
  for(const p of L){
    const k=p.life/p.max;
    sys.pos[n*3]=p.x;sys.pos[n*3+1]=p.y;sys.pos[n*3+2]=p.z;
    sys.col[n*3]=p.c[0];sys.col[n*3+1]=p.c[1];sys.col[n*3+2]=p.c[2];
    sys.siz[n]=p.size*(1+p.grow*(1-k));sys.alp[n]=sys===dustSys?Math.min(1,k*1.4)*0.55:k;
    n++;
  }
  sys.geo.setDrawRange(0,n);
  ['position','aColor','size','alpha'].forEach(a=>sys.geo.attributes[a].needsUpdate=true);
}

  spawnWave(wp.x,wp.z,tint?new THREE.Color(tint[0],tint[1],tint[2]):0xffd080,1.0+power*0.4,0.45);
  crash(power>1.3);
}
function chipAt(wx,wy,wz,n,mat,dirx,dirz){
  for(let i=0;i<n;i++)spawnChunk(wx+rand(-0.1,0.1),wy,wz+rand(-0.1,0.1),rand(-2,2)+dirx*2,rand(2,4.5),rand(-2,2)+dirz*2,rand(0.025,0.05),mat);
  for(let i=0;i<4;i++)emit(dustSys,wx,wy,wz,rand(-0.6,0.6),rand(0.1,0.7),rand(-0.6,0.6),0.6,0.4,[0.62,0.58,0.53],1.8);
}
/* tile-space helpers used by the game logic */
function burst(tx,ty,n,col,sp=100,life=0.5,size=3){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=rand(sp*0.3,sp)*0.025;
    emit(sparkSys,tx-3,0.45,ty-4,Math.cos(a)*s,rand(0.6,2.4),Math.sin(a)*s,life*rand(0.6,1),size*0.045*rand(0.7,1.2),[col[0]/255,col[1]/255,col[2]/255]);
  }
}
const texts=[];
function floatText(tx,ty,txt,col='#fff'){texts.push({x:tx-3,y:1.3,z:ty-4,txt,col,t:0.9});}

/* =====================================================================
   GAME LOGIC
   ===================================================================== */
let state='menu',time=0,shake=0,fade=0,hurtFlash=0;
let G,P,tiles,items,enemies,room,queued,pickQ;
const entVis=new Set();
let best=0;
try{best=+localStorage.getItem('chesscrawl_best')||0;}catch(e){}

function newRun(startT){
  G={floor:1,roomIdx:0,rooms:[],kills:0,score:0,banner:'',bannerT:0};
  P={t:startT,start:startT,x:3,y:8,anim:null,hp:6,maxHp:6,cd:0,inv:0,xp:0,lvl:1,need:4,
     dmgB:0,cdMult:1,tithe:0,parry:0,shield:0,shieldT:0,capCount:0,luck:0,splash:0,up:{},seed:Math.random()*10,vis:null,face:Math.PI,rise:0};
  pickQ=[];queued=null;texts.length=0;
  genFloor();loadRoom();
}
const theme=()=>THEMES[(G.floor-1)%THEMES.length];
const pDmg=()=>PIECES[P.t].dmg+P.dmgB;
const pCd=()=>PIECES[P.t].cd*P.cdMult;
function genFloor(){
  const last=G.floor%3===0?'boss':'elite';
  G.rooms=['combat','combat',Math.random()<0.5?'treasure':'rest','combat',last];
  G.roomIdx=0;G.banner=`Floor ${G.floor} — ${theme().name}`;G.bannerT=3;
}

/* ---------- room generation ---------- */
const PROT=new Set(['3,8','3,7','3,0','3,1','2,8','4,8','2,7','4,7','2,0','4,0']);
function connected(){
  const seen=new Set(['3,8']),q=[[3,8]];let free=0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(tiles[y][x].k===0)free++;
  while(q.length){
    const[x,y]=q.pop();
    for(const[dx,dy]of ORTH){
      const nx=x+dx,ny=y+dy,k=nx+','+ny;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS||seen.has(k)||tiles[ny][nx].k!==0)continue;
      seen.add(k);q.push([nx,ny]);
    }
  }
  return seen.size===free;
}
function loadRoom(){
  const kind=G.rooms[G.roomIdx];
  room={kind,seed:Math.random()*1000,waves:[],waveT:0.8,cleared:false,boss:null,t:0};
  for(let tries=0;tries<40;tries++){
    tiles=[];
    for(let y=0;y<ROWS;y++){tiles.push([]);for(let x=0;x<COLS;x++)tiles[y].push({k:0,sp:null});}
    const n=kind==='boss'?ri(1,3):ri(3,6);
    for(let i=0;i<n;i++){
      const x=ri(0,3),y=ri(2,6);
      if(PROT.has(x+','+y))continue;
      const cells=[[x,y]];
      if(Math.random()<0.4){const[dx,dy]=pick(ORTH);cells.push([x+dx,y+dy]);}
      for(const[ax,ay]of cells){
        if(ax<0||ax>3||ay<2||ay>6||PROT.has(ax+','+ay))continue;
        tiles[ay][ax].k=1;tiles[ay][6-ax].k=1;
      }
    }
    if(connected())break;
  }
  if(G.floor>=2&&(kind==='combat'||kind==='elite')){
    let n=2+G.floor;
    for(let i=0;i<60&&n>0;i++){
      const x=ri(0,COLS-1),y=ri(1,6),t=tiles[y][x];
      if(t.k||t.sp||PROT.has(x+','+y))continue;
      t.sp={off:rand(3)};n--;
    }
  }
  if(kind==='treasure'||kind==='rest')tiles[4][3].k=0; // the chest / fountain must stay reachable
  items=[];enemies=[];
  P.x=3;P.y=8;P.anim=null;queued=null;fade=1;
  if(kind==='treasure'){items.push({x:3,y:4,t:'chest'});room.cleared=true;items.push({x:3,y:0,t:'stairs'});}
  else if(kind==='rest'){items.push({x:3,y:4,t:'fountain'});room.cleared=true;items.push({x:3,y:0,t:'stairs'});}
  else if(kind==='boss'){
    const b=makeEnemy('K',3,2);b.spawn=1.2;b.hp=b.maxhp=14+G.floor*4;b.boss=true;b.sumT=6;b.stoT=7;
    enemies.push(b);room.boss=b;room.waves=[['P','P']];
  }else{
    let budget=kind==='elite'?8+G.floor*3:4+G.floor*2+G.roomIdx;
    const allowed=['P','N'];if(G.floor>=2)allowed.push('B');if(G.floor>=3)allowed.push('R');if(G.floor>=5)allowed.push('Q');
    let bigOne=null;
    if(kind==='elite'){bigOne=G.floor>=4?'Q':'R';budget-=ENEMY[bigOne].cost;}
    const wavesN=budget>=9?2:1,lists=[];
    for(let w=0;w<wavesN;w++)lists.push([]);
    let w=0;
    while(budget>0){
      const opts=allowed.filter(t=>ENEMY[t].cost<=budget);
      if(!opts.length)break;
      const t=pick(opts);lists[w%wavesN].push(t);budget-=ENEMY[t].cost;w++;
    }
    if(bigOne)lists[0].push(bigOne);
    room.waves=lists.filter(l=>l.length);
  }
  setupRoomVisuals();
}
function makeEnemy(t,x,y){
  const d=ENEMY[t],sc=1+0.22*(G.floor-1),hp=Math.ceil(d.hp*sc);
  return{t,x,y,hp,maxhp:hp,dmg:d.dmg+(G.floor>=4?1:0),baseCd:d.cd,windMax:d.wind,cd:rand(0.6,1.4),spawn:0.9,
    wind:null,anim:null,flash:0,seed:rand(10),dead:false,boss:false,stomp:null,stuck:0,lastDist:99,vis:null};
}
function freeSpawnTile(){
  for(let i=0;i<80;i++){
    const x=ri(0,COLS-1),y=ri(0,5);
    if(occ(x,y)||Math.hypot(x-P.x,y-P.y)<3)continue;
    if(enemies.some(e=>!e.dead&&e.x===x&&e.y===y)||(x===3&&y===0))continue;
    return[x,y];
  }
  return null;
}
function spawnWaveList(list){
  for(const t of list){
    const pos=freeSpawnTile();if(!pos)continue;
    enemies.push(makeEnemy(t,pos[0],pos[1]));
    burst(pos[0],pos[1],10,[190,120,255],60,0.6,3);
  }
  tone(180,0.3,'sine',0.06,200);
}

/* ---------- movement rules (shared by player and enemies) ---------- */
function occ(x,y,ign){
  if(x<0||y<0||x>=COLS||y>=ROWS)return'wall';
  if(tiles[y][x].k===1)return'wall';
  if(P.x===x&&P.y===y)return'player';
  for(const e of enemies){
    if(e===ign||e.dead)continue;
    if(e.x===x&&e.y===y)return e.spawn>0?'wall':'enemy';
  }
  return null;
}
function genMoves(t,x,y,side,ign){
  const foe=side==='p'?'enemy':'player',out=[];
  const hop=ds=>{for(const[dx,dy]of ds){const nx=x+dx,ny=y+dy,o=occ(nx,ny,ign);if(!o)out.push({x:nx,y:ny});else if(o===foe)out.push({x:nx,y:ny,cap:true});}};
  const slide=ds=>{for(const[dx,dy]of ds){let nx=x+dx,ny=y+dy;for(;;){const o=occ(nx,ny,ign);if(!o)out.push({x:nx,y:ny});else{if(o===foe)out.push({x:nx,y:ny,cap:true});break;}nx+=dx;ny+=dy;}}};
  if(t==='P'){
    for(const[dx,dy]of ORTH){const nx=x+dx,ny=y+dy;if(!occ(nx,ny,ign))out.push({x:nx,y:ny});}
    for(const[dx,dy]of DIAG){const nx=x+dx,ny=y+dy;if(occ(nx,ny,ign)===foe)out.push({x:nx,y:ny,cap:true});}
  }else if(t==='N')hop(KN);
  else if(t==='K')hop(DIR8);
  else if(t==='B'){
    slide(DIAG);
    // sidestep: a bishop can step 1 tile straight (no capture) so it never gets locked to one square colour
    for(const[dx,dy]of ORTH){const nx=x+dx,ny=y+dy;if(!occ(nx,ny,ign))out.push({x:nx,y:ny});}
  }
  else if(t==='R')slide(ORTH);
  else slide(DIR8);
  return out;
}
function distField(){ // true walking distance (8-neighbour) from the player, around walls
  const d=[];for(let y=0;y<ROWS;y++)d.push(new Array(COLS).fill(99));
  const q=[[P.x,P.y]];d[P.y][P.x]=0;
  for(let i=0;i<q.length;i++){
    const[x,y]=q[i];
    for(const[dx,dy]of DIR8){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS||tiles[ny][nx].k===1||d[ny][nx]<99)continue;
      d[ny][nx]=d[y][x]+1;q.push([nx,ny]);
    }
  }
  return d;
}
function setAnim(en,fx,fy,dur,jump){en.anim={fx,fy,t:0,dur,jump};}

/* ---------- player actions ---------- */
function legalMoves(){return genMoves(P.t,P.x,P.y,'p');}
function onTap(x,y){
  if(state!=='play')return;
  const m=legalMoves().find(m=>m.x===x&&m.y===y);
  if(!m)return;
  if(P.cd>0){queued={x,y};return;}
  doPlayerMove(m);
}
function doPlayerMove(m){
  const dist=Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y));
  P.face=Math.atan2(m.x-P.x,m.y-P.y);
  if(m.cap){
    const e=enemies.find(e=>!e.dead&&e.x===m.x&&e.y===m.y);
    if(e){
      const dx=m.x-P.x,dz=m.y-P.y,dl=Math.hypot(dx,dz)||1;
      e.hitDir=[dx/dl,dz/dl];
      const killed=hitEnemy(e,pDmg());
      if(killed){
        if(P.splash){
          for(const o of enemies){if(!o.dead&&o!==e&&Math.abs(o.x-m.x)<=1&&Math.abs(o.y-m.y)<=1){o.hitDir=[o.x-m.x,o.y-m.y];hitEnemy(o,P.splash);}}
          burst(m.x,m.y,12,[255,230,120],120,0.4,3);spawnWave(m.x-3,m.y-4,0xffe080,1.8,0.45);
        }
        const fx=P.x,fy=P.y;P.x=m.x;P.y=m.y;setAnim(P,fx,fy,P.t==='N'?0.26:0.14+dist*0.02,P.t==='N');
        arrive();
      }else{
        P.anim={fx:P.x,fy:P.y,tx:m.x,ty:m.y,lunge:true,t:0,dur:0.22};
        shake=Math.max(shake,2.5);
      }
    }
  }else{
    const fx=P.x,fy=P.y;P.x=m.x;P.y=m.y;
    setAnim(P,fx,fy,P.t==='N'?0.26:0.1+dist*0.02,P.t==='N');
    tone(220+dist*20,0.06,'square',0.03);
    if(dist>1)for(let i=0;i<5;i++)emit(dustSys,fx-3+(m.x-fx)*Math.random(),0.08,fy-4+(m.y-fy)*Math.random(),rand(-0.3,0.3),rand(0.1,0.4),rand(-0.3,0.3),0.5,0.3,[0.6,0.56,0.5],1.5);
    arrive();
  }
  P.cd=pCd();
}
function arrive(){
  const i=items.findIndex(it=>it.x===P.x&&it.y===P.y);
  if(i<0)return;
  const it=items[i];
  if(it.t==='heart'){items.splice(i,1);healPlayer(2);}
  else if(it.t==='chest'){items.splice(i,1);burst(it.x,it.y,20,[255,214,90],160,0.7,3.5);spawnWave(it.x-3,it.y-4,0xffd060,2,0.6);tone(520,0.3,'triangle',0.07,500);pickQ.push({type:'chest'});}
  else if(it.t==='fountain'&&!it.used){it.used=true;healPlayer(3);burst(it.x,it.y,16,[120,200,255],120,0.7,3);}
  else if(it.t==='stairs'){nextRoom();}
}
function healPlayer(n){
  const h=Math.min(P.maxHp-P.hp,n);if(h<=0)return;
  P.hp+=h;floatText(P.x,P.y,'+'+h,'#7dffb0');tone(600,0.15,'triangle',0.05,300);
  burst(P.x,P.y,8,[120,255,170],90,0.5,2.5);
}
function nextRoom(){
  G.roomIdx++;
  if(G.roomIdx>=G.rooms.length){G.floor++;genFloor();G.score+=100;}
  loadRoom();
}
function hurtPlayer(d){
  if(P.inv>0||state!=='play')return false;
  if(P.shield>0){P.shield=0;P.shieldT=14;floatText(P.x,P.y,'BLOCK','#9fd8ff');burst(P.x,P.y,10,[150,220,255],100,0.4,2.5);tone(500,0.12,'square',0.05);P.inv=0.5;return false;}
  P.hp-=d;P.inv=0.7;shake=9;hurtFlash=0.5;
  floatText(P.x,P.y,'-'+d,'#ff6b7a');
  chipAt(P.x-3,0.6,P.y-4,4,MARBLE,0,0);
  burst(P.x,P.y,10,[255,90,110],150,0.5,3);
  tone(110,0.25,'sawtooth',0.08,-60);crash(false);
  if(P.hp<=0){P.hp=0;die();}
  return true;
}
function die(){
  state='dead';
  if(P.vis){shatter(P.vis,P.t,0,0,1.8,[MARBLE,INNER_STONE],[1,0.85,0.4]);scene.remove(P.vis);disposeGroup(P.vis);P.vis=null;}
  tone(300,0.7,'sawtooth',0.1,-250);shake=14;
  G.final=(G.floor-1)*5+G.roomIdx;
  const isBest=G.final>best;
  if(isBest){best=G.final;try{localStorage.setItem('chesscrawl_best',best);}catch(e){}}
  setTimeout(()=>{
    $('stats').innerHTML=`You reached <b>Floor ${G.floor}</b>, room ${G.roomIdx+1}.<br>Level <b>${P.lvl}</b> ${PIECES[P.t].name} · <b>${G.kills}</b> captures · score <b>${G.score}</b><br>${isBest?'🏆 New best!':'Best: Floor '+(Math.floor(best/5)+1)+', room '+(best%5+1)}`;
    $('dead').classList.add('show');
  },1100);
}

/* ---------- enemies ---------- */
function hitEnemy(e,d){
  if(e.dead)return false;
  e.hp-=d;e.flash=0.15;
  floatText(e.x,e.y,'-'+d,'#ffe27a');
  const hd=e.hitDir||[0,0];
  if(e.hp>0){
    tone(200,0.07,'triangle',0.05);burst(e.x,e.y,5,[255,230,150],90,0.3,2);
    chipAt(e.x-3,0.5,e.y-4,3,INNER_OBS,hd[0],hd[1]);crash(false);
    return false;
  }
  e.dead=true;G.kills++;G.score+=ENEMY[e.t].xp*10;
  if(e.vis){
    const pw=e.boss?2.2:(e.t==='Q'||e.t==='R')?1.4:1;
    shatter(e.vis,e.t,hd[0],hd[1],pw,[OBSIDIAN,INNER_OBS],[0.8,0.45,1]);
    scene.remove(e.vis);disposeGroup(e.vis);entVis.delete(e.vis);e.vis=null;
  }
  tone(150,0.2,'sawtooth',0.06,-80);shake=Math.max(shake,e.boss?14:5);
  addXp(ENEMY[e.t].xp);floatText(e.x,e.y,'+'+ENEMY[e.t].xp+' xp','#8fe0b8');
  if(Math.random()<0.1+P.luck*0.07&&!items.some(it=>it.x===e.x&&it.y===e.y)&&!(e.x===3&&e.y===0))items.push({x:e.x,y:e.y,t:'heart'});
  if(P.tithe&&++P.capCount>=Math.max(1,4-P.tithe)){P.capCount=0;healPlayer(1);}
  if(e.boss){items.push({x:e.x,y:e.y,t:'heart'});pickQ.push({type:'chest'});}
  return true;
}
function addXp(v){
  P.xp+=v;
  while(P.xp>=P.need){
    P.xp-=P.need;P.lvl++;P.need=4+(P.lvl-1)*3;
    if(P.lvl===3&&P.t==='P')pickQ.push({type:'promo1'});
    else if(P.lvl===6&&P.t!=='Q')pickQ.push({type:'promo2'});
    else pickQ.push({type:'level'});
  }
}
function canAttackFrom(e,x,y){return genMoves(e.t,x,y,'e',e).some(m=>m.cap);}
function enemyMove(e,x,y){
  const fx=e.x,fy=e.y;e.x=x;e.y=y;
  setAnim(e,fx,fy,e.t==='N'?0.28:0.16+Math.max(Math.abs(x-fx),Math.abs(y-fy))*0.02,e.t==='N');
}
function think(e){
  const moves=genMoves(e.t,e.x,e.y,'e',e),cap=moves.find(m=>m.cap);
  const rush=room.t>30?0.6:1;
  if(cap){e.wind={x:cap.x,y:cap.y,t:e.windMax,max:e.windMax};e.stuck=0;tone(380,0.08,'square',0.025);return;}
  if(!moves.length){e.cd=0.4;return;}
  const df=distField();
  let bestM=null,bs=1e9;
  for(const m of moves){
    let s=df[m.y][m.x]+rand(0,room.t>30?0.2:1.0);
    if(canAttackFrom(e,m.x,m.y))s-=3;
    if(s<bs){bs=s;bestM=m;}
  }
  // stuck-breaker: if we keep failing to get closer, do something unexpected
  if(df[bestM.y][bestM.x]>=e.lastDist)e.stuck++;else e.stuck=0;
  if(e.stuck>=3){bestM=pick(moves);e.stuck=0;}
  e.lastDist=df[bestM.y][bestM.x];
  enemyMove(e,bestM.x,bestM.y);
  e.cd=e.baseCd*rand(0.9,1.2)*rush;
}
function resolveWind(e){
  const{x,y}=e.wind;e.wind=null;
  const ok=genMoves(e.t,e.x,e.y,'e',e).some(m=>m.x===x&&m.y===y);
  e.cd=e.baseCd*rand(1,1.3)*(room.t>30?0.6:1);
  if(!ok)return;
  const ox=e.x,oy=e.y;
  if(P.x===x&&P.y===y){
    hurtPlayer(e.dmg);
    if(state!=='play')return;
    const opts=ORTH.concat(DIAG).map(([dx,dy])=>({x:x+dx,y:y+dy})).filter(p=>!occ(p.x,p.y,e));
    if(opts.length){
      const s=pick(opts),fx=P.x,fy=P.y;P.x=s.x;P.y=s.y;setAnim(P,fx,fy,0.14,false);
      enemyMove(e,x,y);arrive();
    }else e.anim={fx:ox,fy:oy,tx:x,ty:y,lunge:true,t:0,dur:0.22};
  }else if(!occ(x,y,e))enemyMove(e,x,y);
}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);
    if(e.anim){e.anim.t+=dt;if(e.anim.t>=e.anim.dur)e.anim=null;}
    if(e.spawn>0){e.spawn-=dt;continue;}
    if(e.boss){
      e.sumT-=dt;e.stoT-=dt;
      if(e.stoT<=0&&!e.stomp&&!e.wind){e.stomp={t:0.9,max:0.9};e.stoT=9;tone(120,0.5,'sawtooth',0.07,60);}
      if(e.sumT<=0){e.sumT=8;if(enemies.filter(o=>!o.dead).length<7)spawnWaveList(['P','P']);}
    }
    if(e.stomp){
      e.stomp.t-=dt;e.cd=Math.max(e.cd,0.3);
      if(e.stomp.t<=0){
        e.stomp=null;shake=12;tone(90,0.4,'sawtooth',0.1,-40);crash(true);
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)burst(e.x+dx,e.y+dy,4,[255,120,80],100,0.4,3);
        spawnWave(e.x-3,e.y-4,0xff7a50,3,0.6);
        if(Math.abs(P.x-e.x)<=1&&Math.abs(P.y-e.y)<=1)hurtPlayer(e.dmg);
      }
      continue;
    }
    if(e.wind){e.wind.t-=dt;if(e.wind.t<=0)resolveWind(e);continue;}
    e.cd-=dt;
    if(e.cd<=0&&!e.anim)think(e);
  }
  enemies=enemies.filter(e=>!e.dead);
}

/* ---------- level-up / picks ---------- */
function openPick(){
  if(!pickQ.length||state!=='play')return;
  const entry=pickQ.shift();state='pick';queued=null;
  const box=$('cards');box.innerHTML='';
  const title=$('pickTitle');
  const addCard=(g,n,d,tag,fn)=>{
    const b=document.createElement('button');b.className='card';
    b.innerHTML=`<div class="gl">${g}</div><div><b>${n}${tag?`<i>${tag}</i>`:''}</b><span>${d}</span></div>`;
    b.onclick=()=>{fn();$('pick').classList.remove('show');state='play';tone(660,0.25,'triangle',0.07,400);};
    box.appendChild(b);
  };
  const promote=t=>()=>{
    // the old stone cracks apart and the new piece rises from the rubble
    if(P.vis){shatter(P.vis,P.t,0,0,1.3,[MARBLE,GOLD],[1,0.85,0.35]);scene.remove(P.vis);disposeGroup(P.vis);P.vis=null;}
    P.t=t;P.maxHp+=1;P.hp=Math.min(P.maxHp,P.hp+2);P.rise=0.6;
    spawnWave(P.x-3,P.y-4,0xffd060,3,0.8);shake=8;
    G.banner='Promoted to '+PIECES[t].name+'!';G.bannerT=2.5;
  };
  if(entry.type==='promo1'){
    title.textContent='PROMOTION!';
    for(const t of['N','B','R'])addCard(gl(t),PIECES[t].name,PIECES[t].desc,'+1 max HP',promote(t));
  }else if(entry.type==='promo2'){
    title.textContent='ROYAL PROMOTION!';
    addCard(gl('Q'),'Queen',PIECES.Q.desc,'+1 max HP',promote('Q'));
  }else{
    title.textContent=entry.type==='chest'?'TREASURE!':'LEVEL UP!';
    const pool=UPS.filter(u=>(P.up[u.id]||0)<u.max),picks=[];
    while(picks.length<3&&pool.length)picks.push(pool.splice((Math.random()*pool.length)|0,1)[0]);
    for(const u of picks)addCard(u.g,u.n,u.d,`Lv ${(P.up[u.id]||0)+1}/${u.max}`,()=>{P.up[u.id]=(P.up[u.id]||0)+1;u.f();});
    if(!picks.length){state='play';return;}
  }
  tone(440,0.3,'triangle',0.07,440);
  $('pick').classList.add('show');
}

/* ---------- update ---------- */
function update(dt){
  time+=dt;
  shake=Math.max(0,shake-dt*30);fade=Math.max(0,fade-dt*2.5);hurtFlash=Math.max(0,hurtFlash-dt);
  if(G.bannerT>0)G.bannerT-=dt;
  for(const t of texts)t.t-=dt;
  for(let i=texts.length-1;i>=0;i--)if(texts[i].t<=0)texts.splice(i,1);
  if(P.anim){P.anim.t+=dt;if(P.anim.t>=P.anim.dur)P.anim=null;}
  if(state!=='play')return;
  room.t+=dt;
  P.cd=Math.max(0,P.cd-dt);P.inv=Math.max(0,P.inv-dt);
  if(P.parry&&P.shield<=0){P.shieldT-=dt;if(P.shieldT<=0)P.shield=1;}
  if(queued&&P.cd<=0){const q=queued;queued=null;onTap(q.x,q.y);}
  updateEnemies(dt);
  if(tiles[P.y][P.x].sp){
    const ph=(time+tiles[P.y][P.x].sp.off)%3;
    if(ph>2.3&&P.inv<=0)hurtPlayer(1);
  }
  if(!room.cleared){
    const alive=enemies.some(e=>!e.dead);
    if(!alive){
      if(room.waves.length){room.waveT-=dt;if(room.waveT<=0){spawnWaveList(room.waves.shift());room.waveT=0.7;}}
      else{
        room.cleared=true;items.push({x:3,y:0,t:'stairs'});
        tone(520,0.4,'triangle',0.07,400);floatText(3,1,'ROOM CLEARED','#ffd86b');
        if(room.kind==='elite'||room.kind==='boss')healPlayer(2);
      }
    }
  }
  openPick();
}

/* =====================================================================
   RENDER SYNC
   ===================================================================== */
function epos(en){
  let fx=en.x,fy=en.y,z=0,sq=1;
  const a=en.anim;
  if(a){
    const k=Math.min(1,a.t/a.dur);
    if(a.lunge){const p=Math.sin(k*Math.PI);fx=a.fx+(a.tx-a.fx)*p*0.45;fy=a.fy+(a.ty-a.fy)*p*0.45;}
    else{
      const e=1-Math.pow(1-k,3);fx=a.fx+(en.x-a.fx)*e;fy=a.fy+(en.y-a.fy)*e;
      if(a.jump)z=Math.sin(k*Math.PI)*0.55;
      if(k>0.8)sq=1-0.16*Math.sin((k-0.8)/0.2*Math.PI);
    }
  }
  return{x:fx,y:fy,z,sq};
}
const hintDots=[],hintRings=[],telePlanes=[];
const dotGeo=new THREE.CircleGeometry(0.13,20),ringGeo=new THREE.RingGeometry(0.36,0.45,28),planeGeo=new THREE.PlaneGeometry(1,1);
const addMat=(color,op)=>new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
function flat(geo,mat,list){const m=new THREE.Mesh(geo,mat);m.rotation.x=-Math.PI/2;m.visible=false;scene.add(m);list.push(m);}
for(let i=0;i<64;i++)flat(dotGeo,addMat(0xffffff,0.4),hintDots);
for(let i=0;i<24;i++)flat(ringGeo,addMat(0xff4a5a,0.9),hintRings);
for(let i=0;i<16;i++)flat(planeGeo,addMat(0xff2a3a,0.5),telePlanes);
const queuedMark=new THREE.Mesh(new THREE.RingGeometry(0.4,0.48,4),addMat(0xffd86b,0.9));
queuedMark.rotation.x=-Math.PI/2;queuedMark.rotation.z=Math.PI/4;queuedMark.visible=false;scene.add(queuedMark);
const shieldMesh=new THREE.Mesh(new THREE.SphereGeometry(0.5,20,14),addMat(0x8fd8ff,0.22));
shieldMesh.visible=false;scene.add(shieldMesh);

function syncScene(dt){
  const sw=state==='menu'?Math.sin(time*0.35)*0.9:0,sk=shake*0.012;
  camera.position.set(camBase.x+sw+(sk?rand(-sk,sk):0),camBase.y+(sk?rand(-sk,sk):0),camBase.z);
  camera.lookAt(camTarget);
  torches.forEach(t=>{
    const f=0.8+0.2*Math.sin(time*9+t.seed)+0.1*Math.sin(time*23+t.seed*3);
    t.light.intensity=2.2*f;t.flame.scale.set(1,f*1.2,1);
  });
  for(const s of spikeList){
    const ph=(time+s.sp.off)%3,warn=ph>1.8&&ph<=2.3,on=ph>2.3,k=on?1:warn?0.35:0.08;
    for(const c of s.cones){c.scale.y+=(k-c.scale.y)*Math.min(1,dt*18);c.position.y=0.2*c.scale.y;c.material.emissive.setHex(warn?0x992200:0x000000);}
  }
  // items
  const live=new Set(items);
  for(const[it,o]of itemVis)if(!live.has(it)){scene.remove(o);itemVis.delete(it);}
  for(const it of items){
    let o=itemVis.get(it);if(!o){o=makeItem(it);itemVis.set(it,o);}
    if(o.userData.spin){o.userData.spin.rotation.y=time*2;o.userData.spin.position.y=0.5+Math.sin(time*3)*0.06;}
    if(o.userData.arrow)o.userData.arrow.position.y=Math.abs(Math.sin(time*3))*0.12+0.12;
    if(o.userData.water)o.userData.water.material.emissiveIntensity=it.used?0.1:0.6+0.3*Math.sin(time*4);
    if(it.t==='fountain'&&!it.used&&Math.random()<0.5)emit(sparkSys,it.x-3+rand(-0.04,0.04),0.65,it.y-4+rand(-0.04,0.04),rand(-0.5,0.5),rand(1,2),rand(-0.5,0.5),0.7,0.07,[0.4,0.75,1]);
  }
  // player
  if(state!=='dead'){
    if(!P.vis){P.vis=buildPiece(P.t,true);scene.add(P.vis);}
    const p=epos(P),g=P.vis;
    let rise=0;if(P.rise>0){P.rise-=dt;rise=Math.max(0,P.rise/0.6);}
    g.position.set(p.x-3,p.z+Math.sin(time*3+P.seed)*0.012-rise*0.9,p.y-4);
    const s=1-rise*0.4;g.scale.set(s/p.sq,s*p.sq,s/p.sq);
    let tf=P.face,nd=1e9;
    for(const e of enemies){const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<nd&&e.spawn<=0){nd=d;tf=Math.atan2(e.x-P.x,e.y-P.y);}}
    g.rotation.y=lerpAng(g.rotation.y,tf+(P.t==='N'?0.95:0),Math.min(1,dt*10));
    const blink=P.inv>0&&Math.floor(time*20)%2===0;
    MARBLE.emissive.setHex(blink?0xff2030:0x2a1c08);MARBLE.emissiveIntensity=blink?0.9:0.18;
    playerLight.position.set(p.x-3,1.3,p.y-4+0.3);
    shieldMesh.visible=P.shield>0;shieldMesh.position.set(p.x-3,0.5,p.y-4);shieldMesh.scale.setScalar(1+0.04*Math.sin(time*6));
  }else shieldMesh.visible=false;
  // enemies
  const pp=epos(P);
  for(const e of enemies){
    if(e.dead)continue;
    if(!e.vis){e.vis=buildPiece(e.t,false);cloneBodyMats(e.vis);scene.add(e.vis);entVis.add(e.vis);e.vis.userData.enemy=e;}
    const p=epos(e),g=e.vis,big=e.boss?1.4:1;
    let y=p.z,sc=big;
    if(e.spawn>0){
      const k=clamp(1-e.spawn/0.9,0,1);y=-0.9*(1-k);sc=big*(0.7+0.3*k);
      if(Math.random()<0.4)emit(dustSys,e.x-3+rand(-0.3,0.3),0.05,e.y-4+rand(-0.3,0.3),rand(-0.2,0.2),rand(0.3,0.9),rand(-0.2,0.2),0.6,0.35,[0.6,0.4,0.8],1.4);
    }
    let jx=0,jz=0;
    if(e.wind){const k=1-e.wind.t/e.wind.max;jx=Math.sin(time*70)*0.03*(0.5+k);jz=Math.cos(time*63)*0.03*(0.5+k);}
    if(e.stomp)jx=Math.sin(time*60)*0.05;
    g.position.set(p.x-3+jx,y+Math.sin(time*3+e.seed)*0.01,p.y-4+jz);
    g.scale.set(sc/p.sq,sc*p.sq,sc/p.sq);
    g.rotation.y=lerpAng(g.rotation.y,Math.atan2(pp.x-p.x,pp.y-p.y)+(e.t==='N'?0.95:0),Math.min(1,dt*8));
    if(e.flash>0)setEmissive(g,1,1,1,0.9);
    else if(e.wind){const k=1-e.wind.t/e.wind.max;setEmissive(g,1,0.1,0.15,0.3+0.9*k);}
    else if(e.stomp){const k=1-e.stomp.t/e.stomp.max;setEmissive(g,1,0.35,0.1,0.3+0.8*k);}
    else setEmissive(g,0.3,0.08,0.5,0.1+0.04*Math.sin(time*2+e.seed));
  }
  // telegraphs
  let pi=0;
  const useP=(x,z,w,d,op,rot=0)=>{if(pi>=telePlanes.length)return;const m=telePlanes[pi++];m.visible=true;m.position.set(x,0.03,z);m.scale.set(w,d,1);m.rotation.z=rot;m.material.opacity=op;};
  for(const e of enemies){
    if(e.dead)continue;
    if(e.wind){
      const k=1-e.wind.t/e.wind.max;
      useP(e.wind.x-3,e.wind.y-4,0.92,0.92,0.25+0.45*k+0.1*Math.sin(time*30));
      const ax=e.x-3,az=e.y-4,bx=e.wind.x-3,bz=e.wind.y-4,len=Math.hypot(bx-ax,bz-az);
      if(len>1.1)useP((ax+bx)/2,(az+bz)/2,0.12,len,0.25+0.3*k,Math.atan2(bx-ax,bz-az)+Math.PI);
    }
    if(e.stomp){const k=1-e.stomp.t/e.stomp.max;useP(e.x-3,e.y-4,2.95,2.95,0.18+0.45*k+0.1*Math.sin(time*30));}
  }
  for(let i=pi;i<telePlanes.length;i++)telePlanes[i].visible=false;
  // move hints
  let di=0,rj=0;
  if(state==='play'){
    const ready=P.cd<=0;
    for(const m of legalMoves()){
      if(m.cap){if(rj<hintRings.length){const r=hintRings[rj++];r.visible=true;r.position.set(m.x-3,0.05,m.y-4);r.scale.setScalar(1+0.08*Math.sin(time*8));r.material.opacity=ready?0.95:0.35;}}
      else if(di<hintDots.length){const d=hintDots[di++];d.visible=true;d.position.set(m.x-3,0.05,m.y-4);d.material.opacity=ready?0.45:0.14;}
    }
    queuedMark.visible=!!queued;if(queued)queuedMark.position.set(queued.x-3,0.06,queued.y-4);
  }else queuedMark.visible=false;
  for(let i=di;i<hintDots.length;i++)hintDots[i].visible=false;
  for(let i=rj;i<hintRings.length;i++)hintRings[i].visible=false;
  updatePoints(dustSys,dt);updatePoints(sparkSys,dt);updateChunks(dt);updateWaves(dt);
}

/* ---------- picking ---------- */
const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
function tileFromScreen(px,py){
  ndc.set(px/W*2-1,-(py/H)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const list=[];
  for(const row of tileMeshes)for(const m of row)list.push(m);
  for(const g of entVis)list.push(g);
  for(const h of raycaster.intersectObjects(list,true)){
    let o=h.object;
    while(o){
      if(o.userData.tile)return o.userData.tile;
      if(o.userData.enemy)return[o.userData.enemy.x,o.userData.enemy.y];
      o=o.parent;
    }
  }
  return null;
}

/* ---------- 2D overlay (HUD) ---------- */
const _v=new THREE.Vector3();
function proj(x,y,z){_v.set(x,y,z).project(camera);return[(_v.x+1)/2*W,(1-_v.y)/2*H];}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawOverlay(){
  ctx.clearRect(0,0,W,H);
  if(!G)return;
  ctx.font='800 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of texts){
    const a=clamp(t.t/0.5,0,1),[sx,sy]=proj(t.x,t.y+(0.9-t.t)*0.7,t.z);
    ctx.globalAlpha=a;ctx.fillStyle='#000';ctx.fillText(t.txt,sx+1,sy+1);ctx.fillStyle=t.col;ctx.fillText(t.txt,sx,sy);
  }
  ctx.globalAlpha=1;
  if(state==='play'&&P.cd>0&&P.vis){ // cooldown ring on the floor around the player
    const p=epos(P),c=proj(p.x-3,0.02,p.y-4),ex=proj(p.x-3+0.5,0.02,p.y-4),ez=proj(p.x-3,0.02,p.y-4+0.5);
    const k=1-P.cd/pCd();
    ctx.strokeStyle='rgba(255,214,90,.95)';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(c[0],c[1],Math.abs(ex[0]-c[0]),Math.abs(ez[1]-c[1]),0,-Math.PI/2,-Math.PI/2+k*Math.PI*2);ctx.stroke();
  }
  ctx.textBaseline='top';
  ctx.fillStyle='rgba(0,0,0,.55)';rr(12,12,150,18,9);ctx.fill();
  ctx.fillStyle=P.hp/P.maxHp>0.35?'#ff5c82':'#ff3b3b';rr(12,12,Math.max(9,150*clamp(P.hp/P.maxHp,0,1)),18,9);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='700 12px system-ui';ctx.textAlign='left';ctx.fillText(`♥ ${Math.ceil(P.hp)} / ${P.maxHp}`,22,15);
  ctx.fillStyle='rgba(0,0,0,.55)';rr(12,36,150,10,5);ctx.fill();
  ctx.fillStyle='#7dffd0';rr(12,36,Math.max(5,150*clamp(P.xp/P.need,0,1)),10,5);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='700 12px system-ui';ctx.fillText(`Lv ${P.lvl} ${PIECES[P.t].name}`,12,52);
  ctx.textAlign='right';ctx.font='700 14px system-ui';ctx.fillStyle='#ffd86b';ctx.fillText(`Floor ${G.floor}`,W-12,14);
  ctx.font='12px system-ui';ctx.fillStyle='#d4cde4';
  const kn={combat:'Combat',elite:'Elite',boss:'BOSS',treasure:'Treasure',rest:'Rest'}[room.kind];
  ctx.fillText(`Room ${G.roomIdx+1}/${G.rooms.length} · ${kn}`,W-12,32);
  ctx.fillText(`Captures ${G.kills}`,W-12,48);
  if(room.boss&&!room.boss.dead&&room.boss.spawn<=0){
    const b=room.boss,w=Math.min(W-40,260),x=(W-w)/2,y=70;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(x,y,w,8);ctx.fillStyle='#ff5468';ctx.fillRect(x,y,w*clamp(b.hp/b.maxhp,0,1),8);
    ctx.textAlign='center';ctx.fillStyle='#ffd86b';ctx.font='700 11px system-ui';ctx.fillText('THE BLACK KING',W/2,y-14);
  }
  ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillStyle='rgba(225,218,240,.75)';
  ctx.fillText(G.roomIdx===0&&G.floor===1?'Tap a dot to move · tap a red ring to attack · dodge red tiles':PIECES[P.t].desc,W/2,H-34);
  if(G.bannerT>0){
    ctx.globalAlpha=clamp(G.bannerT,0,1);ctx.font='800 26px system-ui';ctx.fillStyle='#ffd86b';ctx.shadowColor='#e0902a';ctx.shadowBlur=14;
    ctx.fillText(G.banner,W/2,H*0.4);ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  if(hurtFlash>0){ctx.fillStyle=`rgba(255,20,40,${hurtFlash*0.35})`;ctx.fillRect(0,0,W,H);}
  if(P.hp<=P.maxHp*0.3&&state==='play'){ctx.fillStyle=`rgba(255,0,40,${0.07+0.05*Math.sin(time*6)})`;ctx.fillRect(0,0,W,H);}
  if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade})`;ctx.fillRect(0,0,W,H);}
}

/* ---------- input & flow ---------- */
hud.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  const t=tileFromScreen(e.clientX,e.clientY);
  if(t)onTap(t[0],t[1]);
});
addEventListener('keydown',e=>{
  if(state!=='play')return;
  const map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  const d=map[e.key.toLowerCase()];if(d)onTap(P.x+d[0],P.y+d[1]);
});
for(const t of['P','N','B','R']){
  const b=document.createElement('button');b.className='card';
  b.innerHTML=`<div class="gl">${gl(t)}</div><div><b>${PIECES[t].name}${t==='P'?'<i>RECOMMENDED</i>':''}</b><span>${PIECES[t].desc}${t==='P'?' Promotes at levels 3 and 6.':' Promotes to Queen at level 6.'}</span></div>`;
  b.onclick=()=>startRun(t);
  $('starts').appendChild(b);
}
function resetPlayerVis(){if(P&&P.vis){scene.remove(P.vis);disposeGroup(P.vis);P.vis=null;}}
function startRun(t){
  resetPlayerVis();newRun(t);state='play';
  $('menu').classList.remove('show');$('dead').classList.remove('show');$('pick').classList.remove('show');
}
function showMenu(){
  resetPlayerVis();newRun('P');state='menu';
  $('best').textContent=best?`Best: Floor ${Math.floor(best/5)+1}, room ${(best%5)+1}`:'';
  $('menu').classList.add('show');
}
$('again').onclick=()=>{$('dead').classList.remove('show');showMenu();};

addEventListener('resize',resize);
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==='play'||state==='dead')update(dt);else time+=dt;
  syncScene(dt);
  renderer.render(scene,camera);
  drawOverlay();
  requestAnimationFrame(frame);
}
resize();showMenu();
requestAnimationFrame(frame);
window.__cc={get state(){return state;},get P(){return P;},get G(){return G;},get enemies(){return enemies;},get room(){return room;},get tiles(){return tiles;},get items(){return items;},get chunks(){return chunks.length;},legalMoves,onTap,startRun,step(sec){for(let t=0;t<sec;t+=0.05)update(0.05);},killAll(){for(const e of enemies.slice()){e.hitDir=[0.3,-0.9];hitEnemy(e,99);}},die:()=>die()};
})();
