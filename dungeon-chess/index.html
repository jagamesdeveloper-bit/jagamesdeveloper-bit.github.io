<style>
:root{--panel:#1f1b2e;--panel2:#292340;--line:#3d3656;--text:#f4effc;--mute:#c6bfd9;--gold:#d8a548;--gold2:#efc56e;--red:#c9485b;--blue:#5aa9d6}
html{margin:0;height:100%;background:#0e0c15;overflow:hidden}
body{margin:0 auto;height:100%;max-width:200vh;transform:translateZ(0);position:relative;background:#0e0c15;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;color:var(--text)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,8,16,.88);text-align:center;padding:16px;gap:14px;box-sizing:border-box;overflow:auto}
.ov.show{display:flex}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:46px;letter-spacing:6px;font-weight:700;color:var(--gold2);text-shadow:0 3px 0 #000a}
h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:26px;letter-spacing:4px;font-weight:700;color:var(--gold2);text-shadow:0 2px 0 #000a}
p{margin:0;max-width:340px;line-height:1.45;color:#d6cfe8;font-size:16px}
.cards{display:flex;flex-direction:column;gap:10px;width:min(360px,92vw)}
.card{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;color:var(--text);padding:11px 14px;text-align:left;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s}
.card:hover{background:var(--panel2)}.card:active{transform:scale(.985)}
.card.act{border-left-color:var(--blue)}.card.rel{border-left-color:#e0b050;background:#2a2330}.card.alt{border-left-color:var(--red)}
.card .gl{flex:none;width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--gold2);background:#15121f;border:1px solid var(--line);border-radius:6px}
.card.act .gl{color:var(--blue)}.card.alt .gl{color:#e0788a}
.gl svg,.ic{width:26px;height:26px;display:block}
.card b{display:block;font-size:17px;font-weight:700;color:var(--gold2)}.card.act b{color:#bfe3f8}.card.alt b{color:#f2b9c3}
.card span{font-size:14.5px;color:#e8e2f4}
.card i{float:right;font-style:normal;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.card.lock{filter:grayscale(.8) brightness(.7)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ov.show{animation:fadeIn .2s ease-out}
.ov.show>*{animation:rise .32s ease-out both}
.ov.show>*:nth-child(2){animation-delay:.04s}.ov.show>*:nth-child(3){animation-delay:.08s}.ov.show>*:nth-child(4){animation-delay:.12s}.ov.show>*:nth-child(5){animation-delay:.16s}.ov.show>*:nth-child(6){animation-delay:.2s}
.card{animation:rise .3s ease-out both}.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px}
.big{background:var(--gold);border:0;border-bottom:3px solid #8d6420;color:#1a1204;font:700 17px/1 inherit;letter-spacing:2px;padding:13px 34px;border-radius:6px;cursor:pointer;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.big:hover{background:var(--gold2)}.big:active{transform:translateY(2px);border-bottom-width:1px;margin-bottom:2px}
.big .ic{width:18px;height:18px}
.lt .ov{zoom:1.12}
.lt #tip{font-size:16.5px;max-width:330px}
.sm{font-size:13px;padding:9px 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ov.solid{background:rgba(10,8,16,.97)}
#menu{background:linear-gradient(rgba(10,8,16,.4),rgba(10,8,16,.78))}
.ov:not(.solid){backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.chip{display:inline-flex;gap:6px;align-items:center;background:#ffffff0d;border:1px solid var(--line);border-radius:4px;padding:5px 11px;font-size:14px;font-weight:600;color:var(--text)}
.chip .ic{width:14px;height:14px}
.chip.gold{color:var(--gold2);border-color:#d8a54866}.chip.blue{color:#9fd3f0;border-color:#5aa9d666}.chip:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(340px,92vw)}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:14px 6px 12px;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s;animation:rise .35s ease-out both}
.tile:hover{background:var(--panel2)}.tile:active{transform:scale(.98)}
.tile .g{color:var(--gold2);margin-bottom:2px}.tile .g svg{width:50px;height:50px;display:block}
.tile b{font-size:19px;font-weight:700;color:var(--text)}
.tile span{font-size:13.5px;color:var(--mute)}
.tile.rec{border-color:var(--gold)}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}
.hint{font-size:14px;color:#bdb6d0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(340px,92vw)}
.st{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 4px;animation:rise .35s ease-out both}
.st b{display:block;font-size:24px;font-weight:700;color:var(--gold2);line-height:1.1}.st small{font-size:12px;letter-spacing:1.1px;color:var(--mute);text-transform:uppercase}
.st.wide{grid-column:span 2}.st.full{grid-column:1/-1}
.st:nth-child(2){animation-delay:.06s}.st:nth-child(3){animation-delay:.12s}.st:nth-child(4){animation-delay:.18s}.st:nth-child(5){animation-delay:.24s}.st:nth-child(6){animation-delay:.3s}
.badge2{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#1a1204;border-radius:4px;padding:5px 12px;font-weight:700;font-size:12.5px;letter-spacing:1px;text-transform:uppercase}
.badge2 .ic{width:14px;height:14px}
.lbrow{display:flex;gap:10px;align-items:center;width:min(340px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-weight:600;text-align:left}
.lbrow b{color:var(--gold2);width:30px}.lbrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbrow em{font-style:normal;color:#8fd4ae}
.sw{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid #000a;box-shadow:inset 0 -6px 9px #0006,inset 0 4px 6px #fff4}
#skinList{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(340px,92vw)}
#skinList .card{flex-direction:column;text-align:center;padding:10px 6px;gap:6px;border-left-width:1px}
#skinList .card i{float:none;display:block;font-size:11.5px}
#skinList .card span{font-size:12.5px;display:flex;gap:4px;align-items:center;justify-content:center}
#skinList .card span .ic{width:12px;height:12px}
#tip{position:fixed;top:104px;left:50%;transform:translateX(-50%);max-width:300px;background:#1f1b2ef2;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:10px 14px;font-size:14.5px;line-height:1.35;color:var(--text);opacity:0;pointer-events:none;transition:opacity .35s;z-index:6;text-align:left}
#tip.on{opacity:1}
.settings{display:flex;flex-direction:column;gap:10px;width:min(300px,86vw)}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:15px;color:var(--mute)}
.settings input[type=range]{width:160px;accent-color:var(--gold)}
.settings input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.colgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(350px,94vw)}
.colh{font-size:13.5px;letter-spacing:2px;color:var(--mute);text-transform:uppercase;margin:0 0 6px;text-align:left;width:min(350px,94vw)}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 2px 6px;color:var(--gold2);cursor:pointer}
.cell .ic{width:24px;height:24px}
.cell small{font-size:11.5px;color:var(--mute);line-height:1.1;min-height:22px;display:flex;align-items:center;text-align:center}
.cell.lock{opacity:.4;color:#888;cursor:default}
.chip.btn{cursor:pointer;padding:6px 12px}.chip.btn.gold{background:#d8a54822}
#mute{position:fixed;bottom:8px;right:8px;width:38px;height:38px;border-radius:6px;border:1px solid var(--line);background:#1f1b2ecc;color:var(--text);padding:0;display:flex;align-items:center;justify-content:center;z-index:5}
#mute .ic{width:20px;height:20px}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#07060b;z-index:20}
/* main menu */
#menu{background:linear-gradient(rgba(10,8,16,.55),rgba(10,8,16,.86));gap:0;justify-content:center}
#menu .logo{display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:22px}
.eyebrow{font:italic 400 14px Georgia,"Times New Roman",serif;letter-spacing:3px;color:#b9b0cf;text-transform:lowercase;margin-bottom:2px}
#menu h1{font-size:50px;letter-spacing:8px;line-height:1;text-shadow:0 2px 0 #000c;padding-left:8px}
.best{margin-top:10px;font:600 12px "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:10px;min-height:16px}
.best:not(:empty)::before,.best:not(:empty)::after{content:"";width:26px;height:1px;background:#d8a54888}
.gear{position:absolute;top:10px;left:10px;width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:3px;background:#1f1b2ecc;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.gear svg{width:21px;height:21px}.gear:hover{color:var(--gold2)}
.rank{display:flex;border:1px solid #d8a54866;padding:3px;gap:0;background:#0b0912aa}
.pc{width:76px;height:76px;display:flex;align-items:center;justify-content:center;border:0;padding:0;cursor:pointer;color:#8f87a6;position:relative;font-family:inherit;transition:color .15s}
.pc:nth-child(odd){background:#2a2438}.pc:nth-child(even){background:#1a1626}
.pc svg{width:46px;height:46px;display:block;transition:transform .15s}
.pc:hover{color:#cfc6e6}
.pc.on{color:var(--gold2)}
.pc.on svg{transform:translateY(-2px)}
.pc.on::after{content:"";position:absolute;inset:3px;border:1px solid var(--gold)}
.pdesc{margin:14px 0 22px;min-height:42px;font-size:14.5px;line-height:1.4;color:#d6cfe8;max-width:300px}
.pdesc b{display:block;font:700 18px Georgia,"Times New Roman",serif;letter-spacing:3px;text-transform:uppercase;color:var(--gold2);margin-bottom:2px}
.play{width:min(300px,80vw);border:0;background:var(--gold);color:#1a1204;font:700 19px Georgia,"Times New Roman",serif;letter-spacing:9px;text-transform:uppercase;padding:15px 0 15px 9px;cursor:pointer;outline:1px solid var(--gold);outline-offset:4px;transition:background .15s,outline-offset .15s}
.play:hover{background:var(--gold2);outline-offset:6px}.play:active{transform:translateY(1px)}
#menu .play{animation:rise .32s ease-out .2s both,breathe 2.8s ease-in-out .7s infinite}
@keyframes breathe{50%{outline-offset:8px;box-shadow:0 0 22px #d8a54833}}
@keyframes pcpop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(1.22)}100%{transform:translateY(-2px) scale(1)}}
.pc.on svg{animation:pcpop .3s ease-out}
.big:active,.dock button:active,.link:active{transform:scale(.95)}
#boonBtn{margin-top:16px}
.mut{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px}
.link{background:none;border:0;padding:4px 2px;color:var(--mute);font:600 12px "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-bottom:1px dotted #8d84a8}
.link:hover{color:var(--gold2)}
.mut .chips,.mut .hint{display:none}.mut.open .chips{display:flex}.mut.open .hint{display:block;max-width:300px;font-size:13px}
.dock{display:flex;margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.dock button{background:none;border:0;color:var(--mute);font:600 12px "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:6px 10px;cursor:pointer;position:relative}
.dock button+button::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:1px;background:var(--line)}
.dock button:hover{color:var(--gold2)}
#menu .hint{margin-top:14px;font-size:12.5px;color:#9d95b3;max-width:300px}
@media (max-height:700px){#menu h1{font-size:40px}#menu .logo{margin-bottom:14px}.pc{width:64px;height:64px}.pc svg{width:38px;height:38px}.pdesc{margin:10px 0 14px}.dock{margin-top:14px}#menu .hint{margin-top:8px}.ov{gap:8px;padding:10px}h1{font-size:34px;letter-spacing:4px}.card{padding:8px 12px}.card .gl{width:34px;height:34px}.card b{font-size:15px}.card span{font-size:13px}.cards{gap:7px}}
@media (max-height:520px) and (orientation:landscape){
.ov{gap:6px;padding:6px;overflow-y:auto}
h1{font-size:26px;letter-spacing:4px}
#menu .eyebrow,#menu .hint,.best{display:none}#menu h1{font-size:30px;letter-spacing:6px}#menu .logo{margin-bottom:8px}
.pc{width:52px;height:52px}.pc svg{width:30px;height:30px}.pdesc{margin:6px 0 8px;min-height:0}.pdesc b{font-size:15px}.pdesc span{display:none}
.play{padding:10px 0 10px 9px;font-size:16px}.dock{margin-top:8px;padding-top:6px}.mut{margin-top:8px}
.hint{font-size:12px}.chip{padding:3px 10px}
.big.sm{padding:6px 12px;font-size:13px}
}
</style>
</head>

<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<button id="mute" aria-label="Toggle sound"></button>
<div id="err"><p>This game needs WebGL, which your browser could not start.</p></div>

<div id="menu" class="ov show">
  <button class="gear" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/></svg></button>
  <div class="logo"><h1>IN PIECES</h1><div class="best" id="best"></div></div>
  <div class="rank" id="starts"></div>
  <div class="pdesc" id="pdesc"></div>
  <button class="play" id="playBtn">Play</button>
  <button class="chip btn gold" id="boonBtn" style="display:none"></button>
  <div class="mut"><button class="link" id="mutBtn"></button><div class="chips" id="mods"></div><div class="hint" id="modInfo"></div></div>
  <nav class="dock"><button id="bSkins">Skins</button><button id="bCol">Collection</button><button id="bLeg">Legacy</button><button id="bLb">Ranks</button></nav>
</div>

<div id="pick" class="ov">
  <h2 id="pickTitle">LEVEL UP!</h2>
  <div class="cards" id="cards"></div>
</div>

<div id="dead" class="ov">
  <h2>SHATTERED</h2>
  <div class="hint" id="deadCause" style="margin-top:-6px"></div>
  <div class="stats" id="stats"></div>
  <button class="big" id="revive" style="display:none;background:#5aa9d6;border-bottom-color:#2d6a8f;color:#031a2a">Revive · watch ad</button>
  <button class="big sm" id="dblShards" style="display:none;background:#8fd4ae;border-bottom-color:#4f8f6c"></button>
  <button class="big" id="again">TRY AGAIN</button>
  <button class="big sm" id="bLb2">LEADERBOARD</button>
</div>

<div id="skins" class="ov solid">
  <h2>SKINS</h2>
  <p id="skinInfo"></p>
  <div class="cards" id="skinList"></div>
  <button class="big sm" id="skinBack">BACK</button>
</div>

<div id="pauseOv" class="ov solid">
  <h2>PAUSED</h2>
  <div id="pauseInfo" style="display:flex;flex-direction:column;gap:10px;align-items:center"></div>
  <button class="big" id="resume">RESUME</button>
  <button class="big sm" id="pSet">Settings</button>
  <button class="big sm" id="quit">QUIT TO MENU</button>
</div>

<div id="col" class="ov solid" style="justify-content:flex-start;padding-top:22px">
  <h2>COLLECTION</h2>
  <p id="colInfo" style="min-height:20px"></p>
  <div id="colList" style="display:flex;flex-direction:column;gap:14px;align-items:center"></div>
  <button class="big sm" id="colBack">BACK</button>
</div>

<div id="setOv" class="ov solid">
  <h2>SETTINGS</h2>
  <div class="settings">
    <label>Music<input type="range" id="setMusic" min="0" max="100"></label>
    <label>Effects<input type="range" id="setSfx" min="0" max="100"></label>
    <label>Screen shake<input type="checkbox" id="setShake"></label>
    <label>Large text<input type="checkbox" id="setBig"></label>
    <label>Vibration<input type="checkbox" id="setVib"></label>
  </div>
  <button class="big sm" id="setBack">BACK</button>
</div>

<div id="leg" class="ov solid">
  <h2>LEGACY</h2>
  <div class="chip gold" id="legShards"></div>
  <div class="cards" id="legList"></div>
  <button class="big sm" id="legBack">BACK</button>
</div>

<button class="big sm" id="healPill" style="display:none;position:fixed;bottom:176px;left:50%;transform:translateX(-50%);z-index:4;background:#5aa9d6;border-bottom-color:#2d6a8f;color:#031a2a"></button>

<div id="tip"></div>

<div id="lb" class="ov solid">
  <h2 id="lbTitle">LEADERBOARD</h2>
  <div id="lbList" style="display:flex;flex-direction:column;gap:6px;align-items:center"></div>
  <button class="big sm" id="lbBack">BACK</button>
</div>

/* ---------- storage: Bridge Storage on the platform (one call to load, one call to save), localStorage only when there is no Bridge ---------- */
const Store={
  keys:['inpieces_set','inpieces_meta','chesscrawl_best','inpieces_mods','inpieces_top'],
  c:{},dirty:{},timer:0,bridge:typeof bridge!=='undefined',ready:false,
  local(){for(const k of Store.keys){try{const v=localStorage.getItem(k);if(v!=null)Store.c[k]=v;}catch(e){}}},
  get(k){return Store.c[k]==null?null:Store.c[k];},
  set(k,v){
    Store.c[k]=String(v);
    if(!Store.bridge){try{localStorage.setItem(k,Store.c[k]);}catch(e){}return;}
    Store.dirty[k]=1;clearTimeout(Store.timer);Store.timer=setTimeout(Store.flush,400);
  },
  flush(){
    if(!Store.bridge||!Store.ready)return;
    const ks=Object.keys(Store.dirty);if(!ks.length)return;
    Store.dirty={};
    try{bridge.storage.set(ks,ks.map(k=>Store.c[k])).catch(()=>{});}catch(e){}
  },
};
if(!Store.bridge)Store.local();

/* recorded CC0 samples (see CREDITS.md): short effects live in sfx.js, music streams from music/ */
let sfxBus=null,sfxState=0;const SFX_BUF={},lastSfx={};
function audio(){
  if(!ac){
    ac=new(window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
    sfxBus=ac.createGain();sfxBus.gain.value=0.9;sfxBus.connect(comp);
  }
  if(ac.state==='suspended')ac.resume();
  if(!sfxState)loadSfx();
}
function loadSfx(){
  if(!window.SFX)return;sfxState=1;
  for(const k in SFX){
    SFX_BUF[k]=[];
    for(const u of SFX[k]){
      try{
        const bin=atob(u.slice(u.indexOf(',')+1)),arr=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
        ac.decodeAudioData(arr.buffer,buf=>SFX_BUF[k].push(buf),()=>{});
      }catch(e){}
    }
  }
}
function sfx(name,vol=1,rate=1){
  if(silent()||!ac)return;
  const L=SFX_BUF[name];if(!L||!L.length)return;
  const now=ac.currentTime;if(lastSfx[name]&&now-lastSfx[name]<0.04)return;lastSfx[name]=now;
  try{
    const s=ac.createBufferSource(),g=ac.createGain();
    s.buffer=L[(Math.random()*L.length)|0];s.playbackRate.value=rate*(0.93+Math.random()*0.14);g.gain.value=vol*SET.sfx;
    s.connect(g);g.connect(sfxBus);s.start();
  }catch(e){}
}
/* procedural sound layer: small synthesized cues that sit on top of the sample set */
function tone(f,dur,type,vol,f2,delay,lp){
  if(silent()||!ac||!sfxBus)return;
  try{
    const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();let out=g;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol*SET.sfx),t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;g.connect(fl);out=fl;}
    out.connect(sfxBus);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
let noiseBuf=null;
function hiss(f,f2,dur,vol,q,delay){ // band-passed noise, the wet part of a clay sound
  if(silent()||!ac||!sfxBus)return;
  try{
    if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    const t=ac.currentTime+(delay||0),src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
    src.buffer=noiseBuf;src.loop=true;fl.type='bandpass';fl.Q.value=q||1.4;fl.frequency.setValueAtTime(f,t);fl.frequency.exponentialRampToValueAtTime(Math.max(60,f2||f),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol*SET.sfx),t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(fl);fl.connect(g);g.connect(sfxBus);src.start(t,Math.random()*0.5);src.stop(t+dur+0.05);
  }catch(e){}
}

const TRACKS={explore:'music/explore.mp3',boss:'music/boss.mp3'};
let music=null;
function startMusic(){
  if(music)return;
  try{
    audio();music={};
    for(const k in TRACKS){
      const el=new Audio(TRACKS[k]);el.loop=true;el.preload='auto';
      const g=ac.createGain();g.gain.value=0;
      ac.createMediaElementSource(el).connect(g);g.connect(ac.destination);
      music[k]={el,g,want:-1};
    }
    music.explore.el.play().catch(()=>{});
  }catch(e){music=null;}
}
function musicTick(){
  if(!music||!ac)return;
  const boss=room&&room.kind==='boss'&&(state==='play'||state==='pick'),lvl=(silent()||paused||userPaused)?0:1;
  const want={explore:(boss?0:0.5)*lvl*SET.music,boss:(boss?0.55:0)*lvl*SET.music};
  for(const k in music){
    const m=music[k];
    if(m.want!==want[k]){m.g.gain.setTargetAtTime(want[k],ac.currentTime,0.6);m.want=want[k];}
    if(want[k]>0&&m.el.paused)m.el.play().catch(()=>{});
    else if(want[k]===0&&!m.el.paused&&m.g.gain.value<0.01)m.el.pause();
  }
}

function fitCamera(){
  const el=THREE.MathUtils.degToRad(60),lo=-1+2*BOT_H/H,hi=1-2*TOP_H/H;
  const pts=[[-3.9,0,-4.9],[3.9,0,-4.9],[-3.9,0,4.9],[3.9,0,4.9],[-3,0.9,-4.4],[3,0.9,-4.4]].map(p=>new THREE.Vector3(...p));
  for(let d=10;d<70;d+=0.2){
    camera.position.set(0,camTarget.y+Math.sin(el)*d,camTarget.z+Math.cos(el)*d);
    camera.lookAt(camTarget);camera.updateMatrixWorld();camera.updateProjectionMatrix();
    let ok=true;
    for(const p of pts){const v=p.clone().project(camera);if(Math.abs(v.x)>0.96||v.y<lo||v.y>hi){ok=false;break;}}
    if(ok){camBase.copy(camera.position);return;}
  }
  camBase.copy(camera.position);
}

/* ---------- post-processing: bloom + ACES + vignette + grain ---------- */
const FS_VERT='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}';
function initPost(){
  try{
    const mk=(w,h,ms)=>{
      const o={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:THREE.UnsignedByteType};
      if(ms&&renderer.capabilities.isWebGL2){const t=new THREE.WebGLMultisampleRenderTarget(w,h,o);t.samples=4;return t;}
      return new THREE.WebGLRenderTarget(w,h,o);
    };
    const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),null);quad.frustumCulled=false;
    const qs=new THREE.Scene();qs.add(quad);
    const qc=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    const bright=new THREE.ShaderMaterial({uniforms:{tex:{value:null}},vertexShader:FS_VERT,depthTest:false,depthWrite:false,
      fragmentShader:'uniform sampler2D tex;varying vec2 vUv;void main(){vec3 c=texture2D(tex,vUv).rgb;float l=max(max(c.r,c.g),c.b);float k=smoothstep(0.7,1.05,l);gl_FragColor=vec4(c*k,1.0);}'});
    const blur=new THREE.ShaderMaterial({uniforms:{tex:{value:null},dir:{value:new THREE.Vector2(1,0)}},vertexShader:FS_VERT,depthTest:false,depthWrite:false,
      fragmentShader:'uniform sampler2D tex;uniform vec2 dir;varying vec2 vUv;void main(){vec3 s=texture2D(tex,vUv).rgb*0.2270270270;s+=texture2D(tex,vUv+dir*1.3846153846).rgb*0.3162162162;s+=texture2D(tex,vUv-dir*1.3846153846).rgb*0.3162162162;s+=texture2D(tex,vUv+dir*3.2307692308).rgb*0.0702702703;s+=texture2D(tex,vUv-dir*3.2307692308).rgb*0.0702702703;gl_FragColor=vec4(s,1.0);}'});
    const comp=new THREE.ShaderMaterial({uniforms:{scene:{value:null},bloom:{value:null},bloomK:{value:0.7},time:{value:0},res:{value:new THREE.Vector2(1,1)},flash:{value:new THREE.Vector3(0,0,0)}},vertexShader:FS_VERT,depthTest:false,depthWrite:false,
      fragmentShader:'uniform sampler2D scene;uniform sampler2D bloom;uniform float bloomK;uniform float time;uniform vec2 res;uniform vec3 flash;varying vec2 vUv;'+
      'vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);}'+
      'void main(){vec3 c=texture2D(scene,vUv).rgb;vec3 b=texture2D(bloom,vUv).rgb;c+=b*bloomK;c+=flash;c=aces(c*1.08);float lum=dot(c,vec3(0.299,0.587,0.114));c=mix(vec3(lum),c,1.25);'+
      'vec2 q=vUv-0.5;float v=1.0-dot(q,q)*1.35;c*=clamp(v,0.0,1.0)*0.55+0.45;'+
      'c+=(fract(sin(dot(vUv*res+time,vec2(12.9898,78.233)))*43758.5453)-0.5)*0.006;c=pow(c,vec3(1.0/2.2));gl_FragColor=vec4(c,1.0);}'});
    post={quad,qs,qc,bright,blur,comp,rtS:null,rtA:null,rtB:null,mk};
    renderer.toneMapping=THREE.NoToneMapping;
    sizePost();
  }catch(e){post=null;console.warn('post disabled',e);}
}
function sizePost(){
  if(!post)return;
  const v=new THREE.Vector2();renderer.getDrawingBufferSize(v);
  const w=Math.max(2,v.x|0),h=Math.max(2,v.y|0),hw=Math.max(2,w>>1),hh=Math.max(2,h>>1);
  for(const k of['rtS','rtA','rtB'])if(post[k])post[k].dispose();
  post.rtS=post.mk(w,h,!lowQ);post.rtA=post.mk(hw,hh,false);post.rtB=post.mk(hw,hh,false);
  post.rtA.depthBuffer=false;post.rtB.depthBuffer=false;
  post.comp.uniforms.res.value.set(w,h);
  post.blur.uniforms.dir.value.set(1/hw,0);
}
function renderFrame(){
  if(!post){renderer.render(scene,camera);return;}
  const q=post.quad;
  renderer.setRenderTarget(post.rtS);renderer.clear();renderer.render(scene,camera);
  q.material=post.bright;post.bright.uniforms.tex.value=post.rtS.texture;
  renderer.setRenderTarget(post.rtA);renderer.render(post.qs,post.qc);
  const v=new THREE.Vector2(post.rtA.width,post.rtA.height);
  for(let i=0;i<2;i++){
    const s=1+i*1.4;
    q.material=post.blur;
    post.blur.uniforms.tex.value=post.rtA.texture;post.blur.uniforms.dir.value.set(s/v.x,0);
    renderer.setRenderTarget(post.rtB);renderer.render(post.qs,post.qc);
    post.blur.uniforms.tex.value=post.rtB.texture;post.blur.uniforms.dir.value.set(0,s/v.y);
    renderer.setRenderTarget(post.rtA);renderer.render(post.qs,post.qc);
  }
  q.material=post.comp;
  post.comp.uniforms.scene.value=post.rtS.texture;post.comp.uniforms.bloom.value=post.rtA.texture;
  post.comp.uniforms.time.value=time%100;
  renderer.setRenderTarget(null);renderer.render(post.qs,post.qc);
}
function applyQuality(){
  pixelRatio=lowQ?1:Math.min(window.devicePixelRatio||1,1.6);
  renderer.setPixelRatio(pixelRatio);renderer.setSize(W,H,false);
  dirLight.castShadow=!lowQ;
  sizePost();
  ptsMats.forEach(m=>m.uniforms.scale.value=H*pixelRatio*0.5);
}

/* ---------- procedural textures ---------- */
function mkTex(w,h,draw,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  if(srgb)t.encoding=THREE.sRGBEncoding;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;
  return t;
}

const toonGrad=(()=>{const d=new Uint8Array([62,122,196,255]),t=new THREE.DataTexture(d,4,1,THREE.LuminanceFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t;})();
const TOON=o=>new THREE.MeshToonMaterial(Object.assign({gradientMap:toonGrad},o));
const OL_COLOR=new THREE.Color(0x120a1e);
const OL_VERT=(dir)=>'uniform float t;void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position+'+dir+'*t,1.0);}';
const OL_FRAG='uniform vec3 c;void main(){gl_FragColor=vec4(c,1.0);}';
const olNormal=new THREE.ShaderMaterial({uniforms:{t:{value:0.024},c:{value:OL_COLOR}},side:THREE.BackSide,vertexShader:OL_VERT('normalize(normal)'),fragmentShader:OL_FRAG});
const olBox=new THREE.ShaderMaterial({uniforms:{t:{value:0.03},c:{value:OL_COLOR}},side:THREE.BackSide,vertexShader:OL_VERT('normalize(position)'),fragmentShader:OL_FRAG});
const hullMat=new THREE.MeshBasicMaterial({color:OL_COLOR,side:THREE.BackSide});

function stoneDraw(base,seed,crack,bevel){
  return(g,w,h)=>{
    const r=mulberry(seed);
    g.fillStyle=base;g.fillRect(0,0,w,h);
    for(let i=0;i<5;i++){g.fillStyle=`rgba(255,255,255,${0.05+r()*0.07})`;g.beginPath();g.ellipse(r()*w,r()*h,14+r()*26,8+r()*16,r()*3,0,7);g.fill();}
    for(let i=0;i<4;i++){g.fillStyle=`rgba(40,20,70,${0.06+r()*0.08})`;g.beginPath();g.ellipse(r()*w,r()*h,14+r()*24,8+r()*14,r()*3,0,7);g.fill();}
    g.lineCap='round';g.lineJoin='round';
    for(let c=0;c<crack;c++){
      let x=r()*w,y=r()*h;const pts=[[x,y]];
      for(let k=0;k<4;k++){x+=(r()-0.5)*w*0.28;y+=(r()-0.5)*h*0.28;pts.push([x,y]);}
      for(const[lw,col]of[[5,'rgba(255,255,255,.2)'],[3,'rgba(30,14,50,.6)']]){g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const q of pts.slice(1))g.lineTo(q[0],q[1]);g.stroke();}
    }
    for(let i=0;i<10;i++){g.fillStyle='rgba(30,14,50,.35)';g.beginPath();g.arc(r()*w,r()*h,1.5+r()*2,0,7);g.fill();}
    if(bevel){
      g.strokeStyle='rgba(25,12,45,.9)';g.lineWidth=10;g.strokeRect(0,0,w,h);
      g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=4;g.beginPath();g.moveTo(8,h-8);g.lineTo(8,8);g.lineTo(w-8,8);g.stroke();
    }
  };
}

const brickDraw=(g,w,h)=>{

      g.fillStyle=`rgb(${v},${v-8},${v+10})`;g.fillRect(bx+5,y*bh+5,bw-10,bh-10);

    }

const veinDraw=(seed,count)=>(g,w,h)=>{

  g.lineCap='round';

    g.strokeStyle=`rgba(255,255,255,${0.55+r()*0.45})`;g.lineWidth=1.2+r()*2.2;
    g.beginPath();let x=r()*w,y=r()*h;g.moveTo(x,y);

  if(sys.list.length>=sys.max)sys.list.shift();

function updatePoints(sys,dt){
  const L=sys.list;
  for(let i=L.length-1;i>=0;i--){
    const p=L[i];p.life-=dt;
    if(p.life<=0){L.splice(i,1);continue;}
    const dr=Math.exp(-sys.drag*dt);p.vx*=dr;p.vz*=dr;p.vy+=sys.grav*dt;p.vy*=Math.exp(-sys.drag*0.3*dt);
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    if(p.y<0.02&&sys===sparkSys){p.y=0.02;p.vy*=-0.4;}
  }
  let n=0;
  for(const p of L){
    const k=p.life/p.max;
    sys.pos[n*3]=p.x;sys.pos[n*3+1]=p.y;sys.pos[n*3+2]=p.z;
    sys.col[n*3]=p.c[0];sys.col[n*3+1]=p.c[1];sys.col[n*3+2]=p.c[2];
    sys.siz[n]=p.size*(1+p.grow*(1-k));sys.alp[n]=Math.min(1,k*1.4,(1-k)*4+0.05)*sys.ak;
    n++;

const PROT=new Set(['3,8','3,7','3,0','3,1','2,8','4,8','2,7','4,7','2,0','4,0']);
function connected(){
  const seen=new Set(['3,8']),q=[[3,8]];let free=0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(tiles[y][x].k===0)free++;
  while(q.length){
    const[x,y]=q.pop();
    for(const[dx,dy]of ORTH){
      const nx=x+dx,ny=y+dy,k=nx+','+ny;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS||seen.has(k)||tiles[ny][nx].k!==0)continue;
      seen.add(k);q.push([nx,ny]);
    }
  }
  return seen.size===free;
}
function connectedSolid(){
  const seen=new Set(['3,8']),q=[[3,8]];let free=0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(tiles[y][x].k===0&&!tiles[y][x].frag)free++;
  while(q.length){
    const[x,y]=q.pop();
    for(const[dx,dy]of ORTH){
      const nx=x+dx,ny=y+dy,k=nx+','+ny;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS||seen.has(k)||tiles[ny][nx].k!==0||tiles[ny][nx].frag)continue;
      seen.add(k);q.push([nx,ny]);
    }
  }
  return seen.size===free;
}
function bossIndex(){ // the Black Queen holds every third boss slot (floors 9, 18, ...); the rest come in a shuffled order
  const n=Math.floor(G.floor/3);
  if(n%3===0)return 3;
  const others=G.bossOrder.filter(i=>i!==3);
  return others[(n-1-Math.floor(n/3))%others.length];
}
const MID_ROOMS=new Set(['treasure','rest','altar','forge','merchant','kitchen','library','shrine']);
function fullyReachable(t){ // every floor tile can be reached by this piece's own moves (a knight can be cut off by pillars)
  const seen=new Set([8*COLS+3]),q=[8*COLS+3];let free=0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(tiles[y][x].k===0)free++;
  for(let i=0;i<q.length;i++){
    const n=q[i];
    for(const m of staticDests(t,n%COLS,(n/COLS)|0))if(!seen.has(m)){seen.add(m);q.push(m);}
  }
  return seen.size===free;
}

function areaTiles(cx,cy,r){const o=[];for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if(x>=0&&y>=0&&x<COLS&&y<ROWS&&tiles[y][x].k===0)o.push([x,y]);return o;}

function bombard(){ // falling stones in the middle of a fight: standing still is no longer safe

/* ---------- movement rules (shared by player and enemies) ---------- */
function occ(x,y,ign){
  if(x<0||y<0||x>=COLS||y>=ROWS)return'wall';
  if(tiles[y][x].k!==0)return'wall';
  if(P.x===x&&P.y===y)return'player';
  // a tile someone has only just left stays reserved until their slide is nearly done
  if(P.anim&&!P.anim.lunge&&P.anim.t<P.anim.dur*0.7&&P.anim.fx===x&&P.anim.fy===y)return'wall';
  for(const e of enemies){
    if(e===ign||e.dead)continue;
    if(e.x===x&&e.y===y)return e.spawn>0?'wall':'enemy';
    const a=e.anim;if(a&&!a.lunge&&a.t<a.dur*0.7&&a.fx===x&&a.fy===y)return'wall';
  }
  return null;
}
function genMoves(t,x,y,side,ign){
  const foe=side==='p'?'enemy':'player',out=[];
  const hop=ds=>{for(const[dx,dy]of ds){const nx=x+dx,ny=y+dy,o=occ(nx,ny,ign);if(!o)out.push({x:nx,y:ny});else if(o===foe)out.push({x:nx,y:ny,cap:true});}};
  const slide=ds=>{for(const[dx,dy]of ds){let nx=x+dx,ny=y+dy;for(;;){const o=occ(nx,ny,ign);if(!o)out.push({x:nx,y:ny});else{if(o===foe)out.push({x:nx,y:ny,cap:true});break;}nx+=dx;ny+=dy;}}};
  if(t==='P'){
    for(const[dx,dy]of ORTH){const nx=x+dx,ny=y+dy;if(!occ(nx,ny,ign))out.push({x:nx,y:ny});}
    for(const[dx,dy]of DIAG){const nx=x+dx,ny=y+dy;if(occ(nx,ny,ign)===foe)out.push({x:nx,y:ny,cap:true});}
  }else if(t==='N')hop(KN);
  else if(t==='K')hop(DIR8);
  else if(t==='T'){}
  else if(t==='B'){
    slide(DIAG);
    for(const[dx,dy]of ORTH){const nx=x+dx,ny=y+dy;if(!occ(nx,ny,ign))out.push({x:nx,y:ny});}
  }
  else if(t==='R')slide(ORTH);
  else slide(DIR8);
  return out;
}
/* how many of this piece's own moves it needs to reach a tile that attacks the player (walls only; handles knight jumps, bishop colours, pockets) */
function staticDests(t,x,y){
  const out=[],wall=(nx,ny)=>nx<0||ny<0||nx>=COLS||ny>=ROWS||tiles[ny][nx].k!==0;
  const hop=ds=>{for(const[dx,dy]of ds){const nx=x+dx,ny=y+dy;if(!wall(nx,ny))out.push(ny*COLS+nx);}};
  const slide=ds=>{for(const[dx,dy]of ds){let nx=x+dx,ny=y+dy;while(!wall(nx,ny)){out.push(ny*COLS+nx);nx+=dx;ny+=dy;}}};
  if(t==='P')hop(ORTH);else if(t==='N')hop(KN);else if(t==='K')hop(DIR8);else if(t==='T'){}
  else if(t==='B'){slide(DIAG);hop(ORTH);}else if(t==='R')slide(ORTH);else slide(DIR8);
  return out;
}
function attackDist(t){
  const d=new Array(ROWS*COLS).fill(99),q=[],pi=P.y*COLS+P.x;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(tiles[y][x].k!==0)continue;
    const att=t==='P'?(Math.abs(x-P.x)===1&&Math.abs(y-P.y)===1):staticDests(t,x,y).includes(pi);
    if(att){d[y*COLS+x]=0;q.push(y*COLS+x);}
  }
  for(let i=0;i<q.length;i++){
    const n=q[i];
    for(const m of staticDests(t,n%COLS,(n/COLS)|0))if(d[m]>d[n]+1){d[m]=d[n]+1;q.push(m);}
  }
  return d;
}
function setAnim(en,fx,fy,dur,jump){en.anim={fx,fy,t:0,dur,jump};}

/* ---------- player actions ---------- */
function legalMoves(){
  const mv=genMoves(P.t,P.x,P.y,'p');
  if(mv.length)return mv;

function onTap(x,y){

function canAttackFrom(e,x,y){return genMoves(e.t,x,y,'e',e).some(m=>m.cap);}

function activeWinds(){let n=0;for(const e of enemies)if(!e.dead&&e.wind)n++;return n;}
function think(e){
  let moves=genMoves(e.t,e.x,e.y,'e',e);
  const cap=moves.find(m=>m.cap);
  const rush=room.t>30?0.6:1,maxWinds=Math.min(5,2+Math.floor(G.floor/4));
  if(cap&&(activeWinds()<maxWinds||e.boss)){e.wind={x:cap.x,y:cap.y,t:e.windMax,max:e.windMax};e.stuck=0;sfx('tick',0.35);tip('dodge','Enemies flash red before they strike. Step off the marked tile.');return;}
  moves=moves.filter(m=>!m.cap);
  if(!moves.length)moves=ORTH.map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(m=>!occ(m.x,m.y,e)); // deadlock rescue
  if(!moves.length){e.cd=0.4;return;}
  const df=attackDist(e.t);
  let bestM=null,bs=1e9;
  for(const m of moves){
    let s=df[m.y*COLS+m.x]+rand(0,room.t>30?0.2:1.0);
    if(canAttackFrom(e,m.x,m.y))s-=2;
    if(s<bs){bs=s;bestM=m;}
  }
  const nd=df[bestM.y*COLS+bestM.x];
  if(nd>=e.lastDist)e.stuck++;else e.stuck=0;
  if(e.stuck>=3){bestM=pick(moves);e.stuck=0;}
  e.lastDist=df[bestM.y*COLS+bestM.x];

}

    hurtSrc=e;hurtPlayer(e.dmg);
    if(e.aff==='vampiric'){e.hp=Math.min(e.maxhp,e.hp+2);floatText(e.x,e.y,'+2','#ff6a8a');}
    if(state!=='play')return;

    if(opts.length){
      const s=pick(opts),fx=P.x,fy=P.y;P.x=s.x;P.y=s.y;setAnim(P,fx,fy,0.14,false);

function updateWisp(dt){

function roleAI(e,dt){ // special behaviour layered on top of the normal chess movement; true = this frame is handled
  if(e.role==='summoner'){
    if(e.casting){
      e.casting.t-=dt;
      if(e.casting.t<=0){
        e.casting=null;
        const sp=ORTH.concat(DIAG).map(([dx,dy])=>[e.x+dx,e.y+dy]).filter(([x,y])=>!occ(x,y)&&!(x===3&&y===0));
        if(sp.length&&enemies.filter(o=>!o.dead).length<10){const[x,y]=pick(sp);enemies.push(makeEnemy('P',x,y,null,true));burst(x,y,10,[190,120,255],90,0.5,3);sfx('soft',0.7,0.8);}
      }
      return true;
    }
    e.sumT=(e.sumT==null?rand(3.5,5.5):e.sumT)-dt;
    if(e.sumT<=0&&!e.wind){e.sumT=rand(8,11);startCast(e,0.9);spawnWave(e.x-3,e.y-4,0xb070ff,2.4,0.8);sfx('cast',0.6,1.3);return true;}
    if(e.wind||e.anim)return false;
    const mv=genMoves(e.t,e.x,e.y,'e',e);
    if(mv.some(m=>m.cap))return false; // cornered: fight like a normal piece
    e.cd-=dt;if(e.cd>0)return true;
    const free=mv.filter(m=>!m.cap);if(!free.length)return false;
    let best=null,bs=-1;
    for(const m of free){const d=Math.hypot(m.x-P.x,m.y-P.y)+rand(0,0.8);if(d>bs){bs=d;best=m;}}
    enemyMove(e,best.x,best.y);e.cd=e.baseCd*1.1;return true;
  }
  if(e.role==='bomber'){
    if(e.fuse!=null){e.fuse-=dt;if(e.fuse<=0){e.fuse=null;e.hitDir=[0,0];hitEnemy(e,999);}return true;}
    if(Math.abs(e.x-P.x)<=1&&Math.abs(e.y-P.y)<=1&&!e.anim){
      e.fuse=1.0;addZone(areaTiles(e.x,e.y,1),0.9,e.dmg,e,0xff8a2a);sfx('tick',0.6,0.8);floatText(e.x,e.y-0.6,'FUSE','#ffb347');return true;
    }
    return false;
  }
  if(e.role==='warden'){
    e.wardT=(e.wardT||0)-dt;
    if(e.wardT<=0){
      e.wardT=0.4;
      for(const o of enemies){
        if(o===e||o.dead||o.boss||o.barrier||o.spawn>0||o.role==='warden')continue;
        if(Math.abs(o.x-e.x)<=1&&Math.abs(o.y-e.y)<=1){o.barrier=true;o.barrierBy=e;burst(o.x,o.y,6,[120,220,255],70,0.4,2.4);}
      }
    }
  }
  return false;
}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);
    if(e.anim){e.anim.t+=dt;if(e.anim.t>=e.anim.dur)e.anim=null;}
    if(e.spawn>0){e.spawn-=dt;continue;}
    if(e.frozen>0){e.frozen-=dt;continue;}
    if(e.t==='T'&&!e.boss){ // obelisk: never moves, fires telegraphed lines
      if(e.casting){e.casting.t-=dt;if(e.casting.t<=0)e.casting=null;continue;}
      e.cd-=dt;
      if(e.cd<=0){
        e.cd=e.baseCd*rand(0.9,1.15);e.pat=((e.pat||0)+1)%3;
        const tl=e.pat===0?rowTiles(P.y):e.pat===1?colTiles(P.x):raysFrom(e.x,e.y,DIAG);
        addZone(tl,e.windMax,e.dmg,e,0xff6a3a);startCast(e,e.windMax);sfx('cast',0.6,1.2);
      }
      continue;
    }
    if(e.boss){
      const busy=bossAI(e,dt);
      if(busy)continue;
      if(e.bk===1||e.bk===5||e.bk===8)continue; // the Rooks and the Obelisk never walk
    }
    if(e.role&&roleAI(e,dt))continue;
    if(e.wind){e.wind.t-=dt;if(e.wind.t<=0)resolveWind(e);continue;}
    e.cd-=dt;
    if(e.cd<=0&&!e.anim)think(e);
  }
  enemies=enemies.filter(e=>!e.dead);
}

function update(dt){
  time+=dt;
  shake=Math.max(0,shake-dt*30);fade=Math.max(0,fade-dt*2.5);hurtFlash=Math.max(0,hurtFlash-dt);flashW=Math.max(0,flashW-dt*1.4);
  if(G.bannerT>0)G.bannerT-=dt;
  for(const t of texts)t.t-=dt;
  for(let i=texts.length-1;i>=0;i--)if(texts[i].t<=0)texts.splice(i,1);
  if(P.anim){P.anim.t+=dt;if(P.anim.t>=P.anim.dur)P.anim=null;}
  if(state!=='play')return;
  room.t+=dt;AD.tick(dt);G.time=(G.time||0)+dt;
  if(G.floor>=4&&state==='play'&&(room.kind==='combat'||room.kind==='elite')&&!room.cleared&&enemies.some(e=>!e.dead)){
    room.bomb=(room.bomb===undefined?7:room.bomb)-dt;
    if(room.bomb<=0){room.bomb=Math.max(4.5,9-0.35*G.floor)*rand(0.85,1.15);bombard();}
  }
  if(G.streakT>0)G.streakT-=dt;
  P.cd=Math.max(0,P.cd-dt);P.rageT=Math.max(0,P.rageT-dt);if(P.overT>0)P.overT-=dt;
  P.histT=(P.histT||0)+dt;if(P.histT>=0.25){P.histT=0;(P.hist=P.hist||[]).push({x:P.x,y:P.y,hp:P.hp});if(P.hist.length>16)P.hist.shift();}P.inv=Math.max(0,P.inv-dt);P.stoneT=Math.max(0,P.stoneT-dt);
  if(P.hasteT>0){P.hasteT-=dt;if(P.hasteT<=0)P.haste=0;}
  for(const a of P.act){const was=a.cd>0;a.cd=Math.max(0,a.cd-dt);if(was&&a.cd===0&&state==='play')syn('ready');}
  if(P.regen){P.regenT=(P.regenT||0)+dt;if(P.regenT>=26-6*P.regen){P.regenT=0;healPlayer(1);}}
  if(P.parry&&P.shield<=0){P.shieldT-=dt;if(P.shieldT<=0)P.shield=1;}
  if(queued&&P.cd<=0){const q=queued;queued=null;onTap(q.x,q.y);}
  updateEnemies(dt);
  updatePads();updateWisp(dt);updateEchoes(dt);AD.healTick(dt);
  if(state==='play'&&P.hp<=P.maxHp*0.3){P.beatT=(P.beatT||0)-dt;if(P.beatT<=0){P.beatT=1.1;buzz([14,70,14]);syn('beat');}}
  fixOverlaps();
  updateZones(dt);
  updateFrag(dt);
  if(tiles[P.y][P.x].sp){
    const ph=(time+tiles[P.y][P.x].sp.off)%3;
    if(ph>2.3&&P.inv<=0){hurtSrc={label:'spikes'};hurtPlayer(1);}
  }
  if(!room.cleared){
    const alive=enemies.some(e=>!e.dead);
    if(!alive){
      if(room.waves.length){room.waveT-=dt;if(room.waveT<=0){spawnWaveList(room.waves.shift());room.waveT=0.7;}}
      else{
        room.cleared=true;room.zones.length=0;items.push({x:3,y:0,t:'stairs'});
        sfx('door',0.8);floatText(3,1,'ROOM CLEARED','#ffd86b');flushTip();if(P.roomHeal)healPlayer(P.roomHeal);if(P.hp<P.maxHp*0.5)healPlayer(1);
        if(room.kind==='elite')healPlayer(Math.ceil(P.maxHp*0.2));
      }
    }
  }
  openPick();
}

function epos(en){
  let fx=en.x,fy=en.y,z=0,sq=1;
  const a=en.anim;
  if(a){
    const k=Math.min(1,a.t/a.dur);
    if(a.lunge){const p=Math.sin(k*Math.PI);fx=a.fx+(a.tx-a.fx)*p*0.45;fy=a.fy+(a.ty-a.fy)*p*0.45;}
    else{
      const e=1-Math.pow(1-k,3);fx=a.fx+(en.x-a.fx)*e;fy=a.fy+(en.y-a.fy)*e;
      if(a.jump)z=Math.sin(k*Math.PI)*0.55;
      if(k>0.8)sq=1-0.16*Math.sin((k-0.8)/0.2*Math.PI);
    }
  }
  return{x:fx,y:fy,z,sq};
}

/* ---------- picking ---------- */
const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),_hit=new THREE.Vector3();
function tileFromScreen(px,py){
  ndc.set(px/W*2-1,-(py/H)*2+1);
  raycaster.setFromCamera(ndc,camera);
  // 1) tapping a piece itself always means that piece's tile
  const list=[];for(const g of entVis)list.push(g);
  for(const h of raycaster.intersectObjects(list,true)){
    let o=h.object;
    while(o){if(o.userData.enemy)return[o.userData.enemy.x,o.userData.enemy.y];o=o.parent;}
  }
  // 2) otherwise the nearest tile you can actually move to, so no tile is ever hard to hit
  if(state==='play'){
    const a=proj(0,0.05,0),b=proj(1,0.05,0),tilePx=Math.hypot(b[0]-a[0],b[1]-a[1]);
    let best=null,bd=1e9;
    for(const m of legalMoves()){const c=proj(m.x-3,0.05,m.y-4),d=Math.hypot(c[0]-px,c[1]-py);if(d<bd){bd=d;best=m;}}
    if(best&&bd<tilePx*0.9)return[best.x,best.y];
  }
  // 3) fall back to whatever floor tile is under the finger
  if(raycaster.ray.intersectPlane(groundPlane,_hit)){
    const tx=Math.round(_hit.x+3),ty=Math.round(_hit.z+4);
    if(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS)return[tx,ty];
  }
  return null;
}

/* ---------- input & flow ---------- */
const AFF_DESC={armored:'Extra health.',swift:'Acts faster.',explosive:'Explodes when it dies.',splitting:'Splits into pawns when killed.',ghostly:'Dodges the first hit.',vampiric:'Heals when it hits you.',frenzied:'Enrages at half health.',blinker:'Teleports after attacking.'};
const ROLE_DESC={summoner:'Keeps its distance and calls reinforcements.',bomber:'Runs at you and explodes.',warden:'Shields nearby allies.',mimic:'Drops a relic when beaten.'};
const BASE_DESC={P:'Strikes diagonally.',N:'Leaps in an L.',B:'Slides diagonally.',R:'Slides in straight lines.',Q:'Slides in any direction.',K:'Moves one tile any direction.',T:'Fires lines of fire from where it stands.'};
function inspect(x,y){
  const e=enemies.find(o=>!o.dead&&o.x===x&&o.y===y&&o.spawn<=0);if(!e)return false;
  let name=e.boss?BOSSES[e.bk].name.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()):[e.mimic?'Mimic':e.role?e.role[0].toUpperCase()+e.role.slice(1):'',e.aff?e.aff[0].toUpperCase()+e.aff.slice(1):'',PNAME[e.t]].filter(Boolean).join(' ');
  const bits=[`${name}, ${Math.ceil(e.hp)}/${e.maxhp} HP.`];
  if(e.role)bits.push(ROLE_DESC[e.role]);else if(e.mimic)bits.push(ROLE_DESC.mimic);
  if(e.aff)bits.push(AFF_DESC[e.aff]);
  if(!e.role&&!e.boss)bits.push(BASE_DESC[e.t]);
  if(e.barrier)bits.push('Shielded: the next hit is blocked.');
  toast(bits.join(' '),2400);return true;
}
const pausePos=()=>[W/2,24];
function openPause(){
  if(state!=='play'||userPaused)return;
  userPaused=true;
  const ups=UPS.filter(u=>P.up[u.id]).map(u=>`${ic(u.g)}${u.n}${P.up[u.id]>1?' x'+P.up[u.id]:''}`);
  const rel=P.relics.map(id=>RELICS.find(r=>r.id===id)).filter(Boolean).map(r=>`${ic(r.g)}${r.n}`);
  const act=P.act.map(a=>`${ic(ACTIVES[a.id].g)}${ACTIVES[a.id].n} Lv${a.lvl}`);
  const chips=(arr,cls)=>arr.length?`<div class="chips">${arr.map(x=>`<span class="chip ${cls}">${x}</span>`).join('')}</div>`:'';
  $('pauseInfo').innerHTML=`<div class="stats"><div class="st"><b>${G.floor}</b><small>Floor</small></div><div class="st"><b>${Math.ceil(P.hp)}/${P.maxHp}</b><small>Health</small></div><div class="st"><b>${pDmg()}</b><small>Damage</small></div></div>`+
    chips(act,'blue')+chips(rel,'gold')+chips(ups,'')+(ups.length||rel.length||act.length?'':'<span class="hint">Nothing collected yet</span>');
  $('pauseOv').classList.add('show');
}

let inspT=0;
['pointerup','pointercancel','pointerleave'].forEach(n=>hud.addEventListener(n,()=>clearTimeout(inspT)));

  startMusic();

  {const[px,py]=pausePos();if(Math.hypot(e.clientX-stageX()-px,e.clientY-py)<24){openPause();return;}}

    if(!legalMoves().some(m=>m.x===t[0]&&m.y===t[1])&&enemies.some(o=>!o.dead&&o.x===t[0]&&o.y===t[1]))inspT=setTimeout(()=>{if(state==='play'&&!userPaused)inspect(t[0],t[1]);},500); // the piece card only opens on a press-and-hold

});
addEventListener('keydown',e=>{
  if(e.repeat&&(e.key==='Escape'||e.key.toLowerCase()==='p'))return;
  const k=e.key.toLowerCase();
  if(state==='menu'&&document.querySelectorAll('.ov.show').length===1){const o=['P','N','B','R'],i=o.indexOf(pickT);if(k==='enter'||k===' '){e.preventDefault();startRun(pickT);return;}if(k==='arrowright'||k==='d'){pickT=o[(i+1)%4];SET.piece=pickT;saveSet();renderPick();return;}if(k==='arrowleft'||k==='a'){pickT=o[(i+3)%4];SET.piece=pickT;saveSet();renderPick();return;}}
  if(state!=='play'){if(k==='escape')document.querySelectorAll('.ov.show .close,.ov.show .x').forEach(b=>b.click());return;}
  if(k==='escape'||k==='p'){if(userPaused)closePause();else openPause();return;}
  if(userPaused||paused)return;
  if(k==='1'){castActive(0);return;}
  if(k==='2'){castActive(1);return;}
  const map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  const d=map[k];if(!d)return;
  e.preventDefault();
  // pick the legal move that points most closely the way the key says (so Knight, Bishop and Rook work too)
  let best=null,bs=0.45;
  for(const m of legalMoves()){
    const dx=m.x-P.x,dy=m.y-P.y,len=Math.hypot(dx,dy)||1,c=(dx*d[0]+dy*d[1])/len;
    const sc=c-len*0.01+(dy<0?0.001:0);
    if(c>0.45&&sc>bs){bs=sc;best=m;}
  }
  if(best)onTap(best.x,best.y);
});

/* ---------- ad director: decides WHEN ads may show so they earn without annoying the player ----------
   The SDK exposes no price or eCPM for a queued ad (the platform auction picks it), so revenue is
   optimised by timing: always keep an ad preloaded, show interstitials only at natural breaks while the
   player is in a good mood, and offer opt-in rewarded ads where they are most valuable. */
const AD_CFG={
  graceS:75,            // no interstitial during the first minute and a quarter of a session
  cooldownS:150,        // minimum gap between any two ads
  runsBetween:2,        // at most one interstitial per two finished runs
  minRunS:40,           // a run shorter than this is a restart, never interrupt it
  rewardQuietS:200,     // after a rewarded ad the player has had their ad: skip interstitials for a while
  midRunMinS:360,       // mid-run break only for runs this long, at a boss-floor stairwell, when healthy
  patienceMax:100,patienceNeed:45,patienceCost:30,patienceRegenPerS:0.5,
  quickDeath:-15,       // died within 30s: frustration signal
  longRun:10,           // survived 3+ minutes: engaged
  rewardOfferAfterS:50, // do not nag with rewarded offers in the very first minute of a run
